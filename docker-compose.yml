services:
  postgres:
    image: postgres:16-alpine
    container_name: owezy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-owezy}
      POSTGRES_PASSWORD: ${DB_PASS:-owezy_dev}
      POSTGRES_DB: ${DB_NAME:-owezy_dev}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-owezy} -d ${DB_NAME:-owezy_dev}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
