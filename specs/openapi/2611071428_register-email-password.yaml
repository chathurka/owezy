openapi: 3.1.0
info:
  title: 'E01-S01 Register with email and password'
  version: 0.1.0
  description: >
    OpenAPI stub for email/password registration. Finalised during /spec-build.
    Issues JWT session on success and initiates email verification (verify/resend in E01-S05).

security:
  - bearerAuth: []

paths:
  /v1/auth/register:
    post:
      summary: Register with email and password
      operationId: registerWithEmailPassword
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; tokens issued; verification email initiated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '../openapi/_components.yaml#/components/responses/BadRequest'
        '409':
          $ref: '../openapi/_components.yaml#/components/responses/Conflict'
        '422':
          $ref: '../openapi/_components.yaml#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      $ref: '../openapi/_components.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - fullName
        - email
        - password
        - defaultCurrency
        - acceptedTerms
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          description: Display name shown to friends
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: At least 8 characters, one uppercase letter, and one digit
        defaultCurrency:
          type: string
          enum: [USD, EUR, GBP, LKR, INR]
        acceptedTerms:
          type: boolean
          description: Must be true

    RegisterUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - fullName
        - role
        - emailVerified
        - defaultCurrency
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [user]
        emailVerified:
          type: boolean
        defaultCurrency:
          type: string
          enum: [USD, EUR, GBP, LKR, INR]

    RegisterResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - user
        - emailVerificationRequired
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/RegisterUser'
        emailVerificationRequired:
          type: boolean
          const: true
