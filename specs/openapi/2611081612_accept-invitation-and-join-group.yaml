openapi: 3.1.0
info:
  title: Accept invitation and join group
  version: 0.1.0
  description: E03-S04 — accept invitation token while authenticated.

security:
  - bearerAuth: []

paths:
  /v1/invitations/accept:
    post:
      summary: Accept a group invitation
      operationId: acceptGroupInvitation
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 16
      responses:
        '200':
          description: Joined (or already member)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '../2611081606_view-groups-and-group-overview.yaml#/components/schemas/GroupListItem'
        '401':
          $ref: '../openapi/_components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../openapi/_components.yaml#/components/responses/NotFound'
        '409':
          description: Invitation not pending / already used
          content:
            application/json:
              schema:
                $ref: '../openapi/_components.yaml#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      $ref: '../openapi/_components.yaml#/components/securitySchemes/bearerAuth'
