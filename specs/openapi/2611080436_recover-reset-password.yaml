openapi: 3.1.0
info:
  title: 'E01-S06 Recover and reset password'
  version: 0.1.0
  description: Non-enumerating forgot-password and single-use reset token flow.

security:
  - bearerAuth: []

paths:
  /v1/auth/password/forgot:
    post:
      summary: Request password reset email
      operationId: forgotPassword
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Always accepted (no account enumeration)
        '422':
          $ref: '../openapi/_components.yaml#/components/responses/UnprocessableEntity'

  /v1/auth/password/reset:
    post:
      summary: Reset password with token
      operationId: resetPassword
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          $ref: '../openapi/_components.yaml#/components/responses/BadRequest'
        '422':
          $ref: '../openapi/_components.yaml#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      $ref: '../openapi/_components.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    ResetPasswordResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
