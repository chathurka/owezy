openapi: 3.1.0
info:
  title: 'E01-S02 Sign in with email and password'
  version: 0.1.0
  description: >
    OpenAPI stub for email/password sign-in and sign-out.
    Issues JWT session on success; safe 401 on invalid credentials.

security:
  - bearerAuth: []

paths:
  /v1/auth/login:
    post:
      summary: Sign in with email and password
      operationId: loginWithEmailPassword
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established; tokens issued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '../openapi/_components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../openapi/_components.yaml#/components/responses/Unauthorized'
        '422':
          $ref: '../openapi/_components.yaml#/components/responses/UnprocessableEntity'

  /v1/auth/logout:
    post:
      summary: Sign out current session
      operationId: logout
      tags: [Auth]
      security: []
      description: >
        Clears client session. Server accepts missing/invalid Bearer for idempotent
        client logout; refresh-token revocation is Phase 2 (ADR-0001).
      responses:
        '204':
          description: Signed out (no body)
        '400':
          $ref: '../openapi/_components.yaml#/components/responses/BadRequest'

components:
  securitySchemes:
    bearerAuth:
      $ref: '../openapi/_components.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    LoginUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - fullName
        - role
        - emailVerified
        - defaultCurrency
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [user, admin]
        emailVerified:
          type: boolean
        defaultCurrency:
          type: string
          enum: [USD, EUR, GBP, LKR, INR]

    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/LoginUser'
