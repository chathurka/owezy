openapi: 3.1.0
info:
  title: View and manage members
  version: 0.1.0
  description: E03-S05 — list and remove group members.

security:
  - bearerAuth: []

paths:
  /v1/groups/{groupId}/members:
    get:
      summary: List group members
      operationId: listGroupMembers
      tags: [Groups]
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '../openapi/_components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../openapi/_components.yaml#/components/responses/NotFound'
  /v1/groups/{groupId}/members/{userId}:
    delete:
      summary: Remove a member (soft delete)
      operationId: removeGroupMember
      tags: [Groups]
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
        '401':
          $ref: '../openapi/_components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi/_components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi/_components.yaml#/components/responses/NotFound'
        '409':
          description: Cannot remove last owner
          content:
            application/json:
              schema:
                $ref: '../openapi/_components.yaml#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      $ref: '../openapi/_components.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    GroupMember:
      type: object
      required: [userId, fullName, role]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        role:
          type: string
          enum: [owner, member]
