<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owezy — Budgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#635BDB}a:hover{color:#4B43C4}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7FB; font-family: Inter, system-ui, sans-serif; color: #14142B; font-variant-numeric: tabular-nums">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #ECECF3; color: #14142B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<button style="height: 40px; border-radius: 14px; background: #FFFFFF; border: 1px solid #ECECF3; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #14142B"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#635BDB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"></path></svg>November 2026<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<button aria-label="New budget" style="width: 44px; height: 44px; border-radius: 14px; background: #635BDB; border: 0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>

<div style="background: #FFFFFF; border: 1px solid #ECECF3; border-radius: 26px; padding: 20px; display: flex; align-items: center; gap: 18px">
<div style="position: relative; width: 156px; height: 156px; flex-shrink: 0">
<svg width="156" height="156" viewBox="0 0 156 156" role="img" aria-label="66% of monthly budget used">
<circle cx="78" cy="78" r="66" fill="none" stroke="#EFEEFC" stroke-width="16"></circle>
<circle cx="78" cy="78" r="66" fill="none" stroke="#635BDB" stroke-width="16" stroke-linecap="round" stroke-dasharray="273.3 414.7" transform="rotate(-90 78 78)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-size: 11px; font-weight: 600; color: #6E6E87">Left to spend</span>
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.8px">$614</span>
<span style="font-size: 11px; font-weight: 600; color: #6E6E87">of $1,800</span>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #6E6E87; font-weight: 600">Spent</span><span style="font-size: 18px; font-weight: 800">$1,186.00</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #6E6E87; font-weight: 600">Safe daily spend</span><span style="font-size: 18px; font-weight: 800">$26.70</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #6E6E87; font-weight: 600">Days left</span><span style="font-size: 18px; font-weight: 800">23</span></span>
</div>
</div>

<div style="background: #FFF1E6; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B23A08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
<span style="font-size: 13px; font-weight: 600; color: #8A2E06; line-height: 1.4">2 categories are above 80%. Food &amp; dining has $88 left.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">By category</h2>
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #ECECF3; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 13px; background: {{c.tile}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 7px">
<span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 700">{{c.name}}</span><span style="font-size: 13px; font-weight: 800">{{c.spent}} <span style="font-weight: 600; color: #6E6E87">/ {{c.limit}}</span></span></span>
<span style="height: 8px; border-radius: 4px; background: #F0EFF5; overflow: hidden; display: block"><span style="display: block; height: 8px; width: {{c.w}}; background: {{c.bar}}; border-radius: 4px"></span></span>
</span>
<span style="width: 38px; text-align: right; font-size: 12px; font-weight: 800; color: {{c.pctColor}}">{{c.pct}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['Food & dining', 412, 500, '#FFF1E6', '#C2410C', 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7'],
      ['Entertainment', 88, 100, '#FCE7F1', '#A3245F', 'M3 7v3a2 2 0 0 1 0 4v3h18v-3a2 2 0 0 1 0-4V7zM13 7v10'],
      ['Groceries', 152, 200, '#F1EEFE', '#635BDB', 'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0'],
      ['Travel', 286, 400, '#E8F3FE', '#0B6A9E', 'M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z'],
      ['Rent & bills', 248, 600, '#FEF7D6', '#8A6100', 'M13 2 3 14h9l-1 8 10-12h-9z']
    ];
    return {
      cats: list.map(function (r) {
        var p = Math.round(r[1] / r[2] * 100), hot = p >= 80;
        return { name: r[0], spent: '$' + r[1], limit: '$' + r[2], tile: r[3], ink: r[4], icon: r[5], w: p + '%', pct: p + '%', bar: hot ? '#F08A4B' : '#635BDB', pctColor: hot ? '#B23A08' : '#4B4B66' };
      })
    };
  }
}
</script>
</body>
</html>
