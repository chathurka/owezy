<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owezy — Premium</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#635BDB}a:hover{color:#4B43C4}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #14142B; font-variant-numeric: tabular-nums">

<div style="background: #635BDB; color: #FFFFFF; padding: 56px 20px 28px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
<svg width="420" height="420" viewBox="0 0 420 420" fill="none" aria-hidden="true" style="position: absolute; left: -15px; top: -150px"><circle cx="210" cy="210" r="180" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"></circle><circle cx="210" cy="210" r="140" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"></circle><circle cx="210" cy="210" r="100" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="2"></circle></svg>
<a href="Profile.dc.html" aria-label="Close" style="position: absolute; left: 20px; top: 52px; width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<span style="width: 72px; height: 72px; border-radius: 24px; background: #FFFFFF; color: #635BDB; display: flex; align-items: center; justify-content: center; margin-top: 18px; position: relative; box-shadow: 0 12px 30px rgba(20,20,43,0.25)"><svg width="36" height="36" viewBox="0 0 24 24" fill="#EFEEFC" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h20M3 7l5 5 4-7 4 7 5-5-2 11H5z"></path></svg></span>
<h1 style="margin: 6px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; position: relative">Owezy Premium</h1>
<span style="font-size: 15px; font-weight: 500; position: relative">Split smarter. Stress less.</span>
</div>

<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">
<sc-for list="{{features}}" as="f" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 38px; height: 38px; border-radius: 12px; background: #EFEEFC; color: #635BDB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg></span>
<span style="font-size: 13px; font-weight: 600; line-height: 1.3">{{f.label}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
<button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="position: relative; height: 72px; border-radius: 20px; background: {{p.bg}}; border: {{p.border}}; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left">
<span style="width: 22px; height: 22px; border-radius: 11px; border: {{p.radio}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{p.dot}}"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700; color: #14142B">{{p.name}}</span><span style="font-size: 12px; font-weight: 500; color: #6E6E87">{{p.sub}}</span></span>
<span style="font-size: 18px; font-weight: 800; color: #14142B">{{p.price}}</span>
<sc-if value="{{p.badge}}" hint-placeholder-val="{{true}}"><span style="position: absolute; right: 14px; top: -10px; font-size: 11px; font-weight: 800; color: #FFFFFF; background: #0E8A5F; padding: 4px 9px; border-radius: 8px">SAVE 33%</span></sc-if>
</button>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF">
<a href="Main.dc.html" style="height: 56px; border-radius: 18px; background: #635BDB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 10px 24px rgba(99,91,219,0.32)">Start 7-day free trial</a>
<span style="text-align: center; font-size: 12px; font-weight: 500; color: #6E6E87">{{fine}} · Cancel anytime · <a href="Premium.dc.html" style="font-weight: 600">Restore</a></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { plan: 'year' }; }
  renderVals() {
    var self = this, cur = this.state.plan;
    var plans = [
      { id: 'year', name: 'Yearly', sub: '$3.33 / month, billed yearly', price: '$39.99', badge: true },
      { id: 'month', name: 'Monthly', sub: 'Billed every month', price: '$4.99', badge: false }
    ].map(function (p) {
      var on = p.id === cur;
      return Object.assign({}, p, { on: on ? 'true' : 'false', bg: on ? '#F7F6FF' : '#FFFFFF', border: on ? '2px solid #635BDB' : '1.5px solid #E4E3EE', radio: on ? '2px solid #635BDB' : '2px solid #C9C7DC', dot: on ? '#635BDB' : 'transparent', pick: function () { self.setState({ plan: p.id }); } });
    });
    return {
      plans: plans,
      fine: cur === 'year' ? 'Then $39.99/year' : 'Then $4.99/month',
      features: [
        { label: 'Unlimited receipt scans', icon: 'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8' },
        { label: 'Advanced insights', icon: 'M4 20V11M10 20V5M16 20v-6M21 20H3' },
        { label: 'Smart budget alerts', icon: 'M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0' },
        { label: 'Live currency rates', icon: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20' },
        { label: 'Recurring expenses', icon: 'M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5' },
        { label: 'CSV & PDF export', icon: 'M12 3v12M7 10l5 5 5-5M5 21h14' }
      ]
    };
  }
}
</script>
</body>
</html>
