<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owezy — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#635BDB}a:hover{color:#4B43C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7FB; font-family: Inter, system-ui, sans-serif; color: #14142B; font-variant-numeric: tabular-nums">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Profile.dc.html" aria-label="Profile" style="width: 44px; height: 44px; border-radius: 22px; background: #635BDB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none">AM</a>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #6E6E87; font-weight: 500">Good afternoon</span>
<span style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px">Alex Morgan</span>
</div>
<a href="Activity.dc.html" aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #ECECF3; display: flex; align-items: center; justify-content: center; color: #14142B; position: relative">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 4px; background: #C2410C; border: 2px solid #FFFFFF"></span>
</a>
</div>

<div style="background: #635BDB; border-radius: 28px; padding: 22px; color: #FFFFFF; position: relative; overflow: hidden; box-shadow: 0 18px 40px rgba(99,91,219,0.28)">
<svg width="220" height="220" viewBox="0 0 220 220" fill="none" aria-hidden="true" style="position: absolute; right: -70px; top: -80px"><circle cx="110" cy="110" r="100" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="28"></circle><circle cx="110" cy="110" r="46" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="16"></circle></svg>
<div style="display: flex; justify-content: space-between; align-items: center; position: relative">
<span style="font-size: 14px; font-weight: 600">Net balance</span>
<span style="font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.18); padding: 5px 10px; border-radius: 20px">USD</span>
</div>
<div style="font-size: 40px; font-weight: 800; letter-spacing: -1.4px; margin-top: 6px; position: relative">+$842.50</div>
<div style="font-size: 13px; font-weight: 500; margin-top: 2px; position: relative">Across 5 groups and 6 friends</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px; position: relative">
<div style="background: rgba(255,255,255,0.14); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M17 17H7V7"></path></svg>You're owed</span>
<span style="font-size: 19px; font-weight: 700">$1,057.50</span>
</div>
<div style="background: rgba(255,255,255,0.14); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"></path></svg>You owe</span>
<span style="font-size: 19px; font-weight: 700">$215.00</span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{actions}}" as="q" hint-placeholder-count="4">
<a href="{{q.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14142B; font-size: 12px; font-weight: 600">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #FFFFFF; border: 1px solid #ECECF3; display: flex; align-items: center; justify-content: center; color: #635BDB"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg></span>
{{q.label}}
</a>
</sc-for>
</div>

<a href="Budgets.dc.html" style="background: #FFFFFF; border-radius: 24px; padding: 18px; border: 1px solid #ECECF3; display: flex; gap: 16px; align-items: flex-end; text-decoration: none; color: #14142B">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #6E6E87; font-weight: 600">November spending</span>
<span style="font-size: 24px; font-weight: 800; letter-spacing: -0.6px">$1,186.00</span>
<div style="height: 6px; border-radius: 3px; background: #EFEEFC; overflow: hidden"><div style="width: 66%; height: 6px; background: #635BDB; border-radius: 3px"></div></div>
<span style="font-size: 12px; color: #6E6E87; font-weight: 500">66% of $1,800 budget</span>
</div>
<svg width="128" height="72" viewBox="0 0 128 72" role="img" aria-label="Daily spending this week, highest on Thursday at $254">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<rect x="{{b.x}}" y="{{b.y}}" width="12" height="{{b.h}}" rx="4" fill="{{b.fill}}"></rect>
</sc-for>
</svg>
</a>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.2px">Recent activity</h2>
<a href="Activity.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: none">See all</a>
</div>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
<a href="ExpenseDetails.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; text-decoration: none; color: #14142B">
<span style="width: 44px; height: 44px; border-radius: 14px; background: {{r.tile}}; color: {{r.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 12px; color: #6E6E87; font-weight: 500">{{r.sub}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="font-size: 15px; font-weight: 700; color: {{r.color}}">{{r.amount}}</span>
<span style="font-size: 11px; color: #6E6E87; font-weight: 500">{{r.note}}</span>
</span>
</a>
</sc-for>
</div>
</div>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #FFFFFF; border-top: 1px solid #ECECF3; display: flex; justify-content: space-around; align-items: flex-start; padding: 10px 8px 0">
<a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #635BDB; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="#EFEEFC" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="Groups.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E6E87; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6M22 19v-1a4 4 0 0 0-3-3.87M16 4.13a3 3 0 0 1 0 5.74"></path></svg>Groups</a>
<a href="AddExpense.dc.html" aria-label="Add expense" style="width: 56px; height: 56px; border-radius: 20px; background: #635BDB; color: #FFFFFF; margin-top: -26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(99,91,219,0.40)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
<a href="Activity.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E6E87; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>Activity</a>
<a href="Analytics.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E6E87; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"></path></svg>Insights</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

      var h = Math.round(v / 254 * 64);
      return { x: i * 19, y: 72 - h, h: h, fill: i === 6 ? '#635BDB' : '#D9D6F8' };
    });
    return {
      bars: bars,
      actions: [
        { label: 'Add', href: 'AddExpense.dc.html', icon: 'M12 5v14M5 12h14' },
        { label: 'Settle up', href: 'Settlements.dc.html', icon: 'M20 6 9 17l-5-5' },
        { label: 'Split', href: 'SplitExpense.dc.html', icon: 'M16 3h5v5M8 3H3v5M21 3l-7 7M3 3l7 7M12 22v-8' },
        { label: 'Balances', href: 'Balances.dc.html', icon: 'M20 7H5a2 2 0 0 1 0-4h13v4M3 5v14a2 2 0 0 0 2 2h15V7M16 14h.01' }
      ],
      recent: [
        { title: 'Electricity — Oct', sub: 'Flatmates · Sana paid', amount: '$32.00', note: 'you owe', color: '#C2410C', tile: '#FEF7D6', ink: '#8A6100', icon: 'M13 2 3 14h9l-1 8 10-12h-9z' },
        { title: 'Leo paid you', sub: 'Lisbon Trip · Bank transfer', amount: '+$50.00', note: 'received', color: '#0E8A5F', tile: '#E6F6EF', ink: '#0E8A5F', icon: 'M20 6 9 17l-5-5' },
        { title: 'Pizza night', sub: 'Friday Dinners · You paid', amount: '$70.00', note: 'you lent', color: '#0E8A5F', tile: '#FFF1E6', ink: '#C2410C', icon: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7' }
      ]
    };
  }
}
</script>
</body>
</html>
