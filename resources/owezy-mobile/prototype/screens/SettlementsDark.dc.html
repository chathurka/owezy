<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owezy Dark — Settle up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#9C96FF}a:hover{color:#C8C4FF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0D1A; font-family: Inter, system-ui, sans-serif; color: #F2F1FA; font-variant-numeric: tabular-nums">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="BalancesDark.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #1A1930; border: 1px solid #2A2944; color: #F2F1FA; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">Settle up</h1>
<span style="width: 44px"></span>
</div>

<div style="background: #635BDB; color: #FFFFFF; border-radius: 28px; padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative; overflow: hidden; box-shadow: 0 18px 40px rgba(99,91,219,0.28)">
<svg width="300" height="300" viewBox="0 0 300 300" fill="none" aria-hidden="true" style="position: absolute; left: -150px; bottom: -190px"><circle cx="150" cy="150" r="120" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="40"></circle></svg>
<div style="display: flex; align-items: center; gap: 14px; position: relative">
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 56px; height: 56px; border-radius: 28px; background: #1A1930; color: #9C96FF; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center">AM</span><span style="font-size: 12px; font-weight: 600">You</span></span>
<svg width="70" height="20" viewBox="0 0 70 20" fill="none" aria-hidden="true" style="margin-top: -20px"><path d="M2 10h62" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"></path><path d="M58 4l7 6-7 6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 56px; height: 56px; border-radius: 28px; background: #3A2E10; color: #F2CF73; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center">SI</span><span style="font-size: 12px; font-weight: 600">Sana Iqbal</span></span>
</div>
<span style="font-size: 44px; font-weight: 800; letter-spacing: -1.6px; position: relative">$145.00</span>
<span style="font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.18); padding: 6px 12px; border-radius: 20px; position: relative">Flatmates · 12 Elm St</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">Pay with</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
<button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 64px; border-radius: 18px; background: #1A1930; border: {{m.border}}; box-shadow: {{m.ring}}; display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left">
<span style="width: 38px; height: 38px; border-radius: 12px; background: {{m.tile}}; color: {{m.ink}}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 700; color: #F2F1FA">{{m.label}}</span><span style="font-size: 11px; font-weight: 500; color: #A3A2BD">{{m.sub}}</span></span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 15px; font-weight: 700">Recent settlements</h2><a href="ActivityDark.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: none">History</a></div>
<sc-for list="{{history}}" as="h" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0">
<span style="width: 40px; height: 40px; border-radius: 13px; background: {{h.tile}}; color: {{h.ink}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{h.icon}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{h.title}}</span><span style="font-size: 12px; color: #A3A2BD; font-weight: 500">{{h.sub}}</span></span>
<span style="font-size: 14px; font-weight: 800; color: {{h.color}}">{{h.amount}}</span>
</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #1A1930; border-top: 1px solid #2A2944">
<a href="ActivityDark.dc.html" style="height: 56px; border-radius: 18px; background: #635BDB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Record $145.00 payment</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: 'bank' }; }
  renderVals() {
    var self = this, cur = this.state.m;
    var methods = [
      { id: 'bank', label: 'Bank transfer', sub: 'Chase ··4417', tile: '#2A2752', ink: '#9C96FF', icon: 'M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-7 10 7z' },
      { id: 'paypal', label: 'PayPal', sub: 'sana.iqbal', tile: '#13304A', ink: '#8DCBF5', icon: 'M2 6h20v12H2zM2 10h20' },
      { id: 'cash', label: 'Cash', sub: 'In person', tile: '#12321F', ink: '#4CD592', icon: 'M2 7h20v10H2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M6 12h.01M18 12h.01' },
      { id: 'other', label: 'Other', sub: 'Venmo, Revolut…', tile: '#24233D', ink: '#C9C8DE', icon: 'M5 12h.01M12 12h.01M19 12h.01' }
    ].map(function (m) {
      var on = m.id === cur;
      return Object.assign({}, m, { on: on ? 'true' : 'false', border: on ? '1.5px solid #635BDB' : '1px solid #2A2944', ring: on ? '0 0 0 4px #2A2752' : 'none', pick: function () { self.setState({ m: m.id }); } });
    });
    var inn = { tile: '#12321F', ink: '#4CD592', color: '#4CD592', icon: 'M17 7 7 17M17 17H7V7' };
    var out = { tile: '#3A2416', ink: '#FF9A5C', color: '#F2F1FA', icon: 'M7 17 17 7M7 7h10v10' };
    return {
      methods: methods,
      history: [
        Object.assign({ title: 'Leo paid you', sub: 'Today · Bank transfer', amount: '+$50.00' }, inn),
        Object.assign({ title: 'You paid Jordan', sub: 'Oct 30 · Cash', amount: '−$45.00' }, out),
        Object.assign({ title: 'Daniel paid you', sub: 'Oct 28 · PayPal', amount: '+$120.00' }, inn)
      ]
    };
  }
}
</script>
</body>
</html>
