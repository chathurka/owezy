<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owezy Dark — Expense details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#9C96FF}a:hover{color:#C8C4FF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0D1A; font-family: Inter, system-ui, sans-serif; color: #F2F1FA; font-variant-numeric: tabular-nums">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="GroupDetailsDark.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #1A1930; border: 1px solid #2A2944; color: #F2F1FA; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; gap: 10px">
<a href="AddExpenseDark.dc.html" aria-label="Edit expense" style="width: 44px; height: 44px; border-radius: 14px; background: #1A1930; border: 1px solid #2A2944; color: #F2F1FA; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></a>
<button aria-label="More options" style="width: 44px; height: 44px; border-radius: 14px; background: #1A1930; border: 1px solid #2A2944; color: #F2F1FA; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 64px; height: 64px; border-radius: 22px; background: #3A2416; color: #FF9A5C; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"></path></svg></span>
<h1 style="margin: 4px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px">Dinner at Time Out Market</h1>
<span style="font-size: 13px; color: #A3A2BD; font-weight: 500">Lisbon Trip · Fri, Oct 23 · 8:42 PM</span>
<span style="font-size: 40px; font-weight: 800; letter-spacing: -1.4px; margin-top: 2px">$186.50</span>
</div>

<div style="background: #1A1930; border: 1px solid #2A2944; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #3D1E30; color: #F5A3CB; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">MC</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A3A2BD; font-weight: 600">Paid by</span><span style="font-size: 15px; font-weight: 700">Maya Chen</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 12px; color: #A3A2BD; font-weight: 600">Your share</span><span style="font-size: 15px; font-weight: 800; color: #FF9A5C">$37.30</span></span>
</div>

<div style="background: #1A1930; border: 1px solid #2A2944; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">Split equally · 5</h2>
<span style="font-size: 12px; font-weight: 600; color: #A3A2BD">2 of 4 settled</span>
</div>
<div style="height: 6px; border-radius: 3px; background: #2A2752; overflow: hidden"><div style="width: 50%; height: 6px; background: #635BDB; border-radius: 3px"></div></div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{people}}" as="p" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0">
<span style="width: 34px; height: 34px; border-radius: 17px; background: {{p.bg}}; color: {{p.fg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.i}}</span>
<span style="flex: 1; font-size: 14px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 10px; background: {{p.chipBg}}; color: {{p.chipFg}}">{{p.status}}</span>
<span style="width: 62px; text-align: right; font-size: 14px; font-weight: 700">$37.30</span>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 10px">
<div style="width: 92px; height: 92px; border-radius: 18px; background: #1A1930; border: 1px solid #2A2944; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="52" height="68" viewBox="0 0 52 68" role="img" aria-label="Receipt photo"><path d="M2 2h48v62l-6-4-6 4-6-4-6 4-6-4-6 4-6-4-6 4z" fill="#24233D" stroke="#3A3670" stroke-width="1.5"></path><rect x="9" y="12" width="26" height="4" rx="2" fill="#C9C5F4"></rect><rect x="9" y="22" width="34" height="3" rx="1.5" fill="#DEDBF8"></rect><rect x="9" y="29" width="30" height="3" rx="1.5" fill="#DEDBF8"></rect><rect x="9" y="36" width="34" height="3" rx="1.5" fill="#DEDBF8"></rect><rect x="9" y="46" width="18" height="4" rx="2" fill="#635BDB"></rect></svg>
</div>
<div style="flex: 1; background: #1A1930; border: 1px solid #2A2944; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #13304A; color: #8DCBF5; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center">LP</span><span style="font-size: 12px; font-weight: 700">Leo</span><span style="font-size: 11px; color: #A3A2BD">2w ago</span></span>
<span style="font-size: 13px; color: #C9C8DE; line-height: 1.4">Best bacalhau of the trip. Paid my part!</span>
</div>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #1A1930; border-top: 1px solid #2A2944">
<a href="SettlementsDark.dc.html" style="height: 56px; border-radius: 18px; background: #635BDB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none">Settle $37.30 with Maya</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var paid = { chipBg: '#2A2752', chipFg: '#A9A4FF', status: 'Paid' };
    var done = { chipBg: '#12321F', chipFg: '#6EE0A6', status: 'Settled' };
    var owes = { chipBg: '#3A2416', chipFg: '#FF9A5C', status: 'Owes' };
    function p(i, name, bg, fg, s) { return Object.assign({ i: i, name: name, bg: bg, fg: fg }, s); }
    return {
      people: [
        p('MC', 'Maya Chen', '#3D1E30', '#F5A3CB', paid),
        p('AM', 'You', '#635BDB', '#FFFFFF', owes),
        p('LP', 'Leo Park', '#13304A', '#8DCBF5', done),
        p('DR', 'Daniel Ruiz', '#143826', '#7FDCA6', owes),
        p('PN', 'Priya Nair', '#3D2418', '#FFB48A', done)
      ]
    };
  }
}
</script>
</body>
</html>
