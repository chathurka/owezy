<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owezy Dark — Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#9C96FF}a:hover{color:#C8C4FF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0D1A; font-family: Inter, system-ui, sans-serif; color: #F2F1FA; font-variant-numeric: tabular-nums">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="MainDark.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #1A1930; border: 1px solid #2A2944; color: #F2F1FA; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">Profile</h1>
<button aria-label="Edit profile" style="width: 44px; height: 44px; border-radius: 14px; background: #1A1930; border: 1px solid #2A2944; color: #F2F1FA; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 68px; height: 68px; border-radius: 34px; background: #635BDB; color: #FFFFFF; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #FFFFFF, 0 0 0 6px #3A3670">AM</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.4px">Alex Morgan</span>
<span style="font-size: 13px; color: #A3A2BD; font-weight: 500">alex.morgan@mail.com</span>
<span style="align-self: flex-start; font-size: 11px; font-weight: 700; color: #C9C8DE; background: #22213A; padding: 3px 8px; border-radius: 8px; margin-top: 2px">Free plan</span>
</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1A1930; border: 1px solid #2A2944; border-radius: 20px; padding: 14px 0">
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 18px; font-weight: 800">5</span><span style="font-size: 12px; color: #A3A2BD; font-weight: 600">Groups</span></span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-left: 1px solid #2A2944; border-right: 1px solid #2A2944"><span style="font-size: 18px; font-weight: 800">148</span><span style="font-size: 12px; color: #A3A2BD; font-weight: 600">Expenses</span></span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 18px; font-weight: 800">23</span><span style="font-size: 12px; color: #A3A2BD; font-weight: 600">Friends</span></span>
</div>

<a href="PremiumDark.dc.html" style="background: #2A2650; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #FFFFFF">
<span style="width: 40px; height: 40px; border-radius: 13px; background: #635BDB; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h20M3 7l5 5 4-7 4 7 5-5-2 11H5z"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">Upgrade to Premium</span><span style="font-size: 12px; font-weight: 500; color: #C9C7DC">Unlimited scans, exports &amp; smart budgets</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 2px 4px; font-size: 12px; font-weight: 700; color: #A3A2BD; letter-spacing: 0.5px">ACCOUNT</h2>
<div style="background: #1A1930; border: 1px solid #2A2944; border-radius: 20px; padding: 0 14px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="3">
<a href="ProfileDark.dc.html" style="display: flex; align-items: center; gap: 12px; height: 54px; border-bottom: {{l.line}}; text-decoration: none; color: #F2F1FA">
<span style="width: 34px; height: 34px; border-radius: 11px; background: #24233D; color: #9C96FF; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.icon}}"></path></svg></span>
<span style="flex: 1; font-size: 14px; font-weight: 600">{{l.label}}</span>
<span style="font-size: 13px; color: #A3A2BD; font-weight: 500">{{l.value}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A2BD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
</a>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 2px 4px; font-size: 12px; font-weight: 700; color: #A3A2BD; letter-spacing: 0.5px">PREFERENCES</h2>
<div style="background: #1A1930; border: 1px solid #2A2944; border-radius: 20px; padding: 0 14px">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; height: 54px; border-bottom: {{t.line}}">
<span style="width: 34px; height: 34px; border-radius: 11px; background: #24233D; color: #9C96FF; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
<span style="flex: 1; font-size: 14px; font-weight: 600">{{t.label}}</span>
<button role="switch" aria-checked="{{t.on}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="width: 48px; height: 28px; border-radius: 14px; border: 0; padding: 0; background: {{t.track}}; position: relative; transition: background 0.2s"><span style="position: absolute; top: 3px; left: {{t.knob}}; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(20,20,43,0.2); transition: left 0.2s"></span></button>
</div>
</sc-for>
</div>
</div>

<button style="height: 50px; border-radius: 16px; background: #1A1930; border: 1px solid #2A2944; color: #FF8A80; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Sign out</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { notif: true, faceid: true, dark: false }; }
  renderVals() {
    var self = this, s = this.state;
    var links = [
      { label: 'Payment methods', value: '2 linked', icon: 'M2 6h20v12H2zM2 10h20' },
      { label: 'Default currency', value: 'USD', icon: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20' },
      { label: 'Privacy & security', value: '', icon: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10' }
    ].map(function (l, i) { l.line = i < 2 ? '1px solid #26253E' : '0'; return l; });
    var toggles = [
      { id: 'notif', label: 'Push notifications', icon: 'M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0' },
      { id: 'faceid', label: 'Face ID unlock', icon: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4' },
      { id: 'dark', label: 'Dark mode', icon: 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8' }
    ].map(function (t, i) {
      var on = !!s[t.id];
      return { label: t.label, icon: t.icon, on: on ? 'true' : 'false', track: on ? '#635BDB' : '#3A3956', knob: on ? '23px' : '3px', line: i < 2 ? '1px solid #26253E' : '0', flip: function () { var o = {}; o[t.id] = !s[t.id]; self.setState(o); } };
    });
    return { links: links, toggles: toggles };
  }
}
</script>
</body>
</html>
