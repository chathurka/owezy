<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owezy Dark — Add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#9C96FF}a:hover{color:#C8C4FF}
button,input{font-family:inherit}
button{cursor:pointer}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1A1930; font-family: Inter, system-ui, sans-serif; color: #F2F1FA; font-variant-numeric: tabular-nums">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="MainDark.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 14px; background: #24233D; color: #F2F1FA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">Add expense</h1>
<button style="height: 36px; border-radius: 18px; background: #2A2752; color: #A9A4FF; border: 0; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>Lisbon Trip<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 4px">
<label for="amt" style="font-size: 13px; font-weight: 600; color: #A3A2BD">Amount</label>
<div style="display: flex; align-items: baseline; justify-content: center; gap: 4px">
<span style="font-size: 30px; font-weight: 700; color: #A3A2BD">$</span>
<input id="amt" inputMode="decimal" defaultValue="186.50" style="width: 210px; border: 0; font-size: 56px; font-weight: 800; letter-spacing: -2px; color: #F2F1FA; text-align: center; padding: 0; background: transparent">
</div>
<span style="font-size: 12px; font-weight: 600; color: #A9A4FF; background: #2A2752; padding: 6px 12px; border-radius: 20px">$37.30 each · 5 people</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="desc" style="font-size: 12px; font-weight: 600; color: #A3A2BD">Description</label>
<input id="desc" defaultValue="Dinner at Time Out Market" style="height: 52px; border-radius: 16px; border: 1.5px solid #635BDB; background: #1A1930; padding: 0 16px; font-size: 15px; font-weight: 600; color: #F2F1FA; box-shadow: 0 0 0 4px #2A2752">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: #A3A2BD">Category</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 40px; border-radius: 20px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="border: 1px solid #2A2944; border-radius: 20px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; text-decoration: none; color: #F2F1FA; border-bottom: {{r.line}}">
<span style="width: 36px; height: 36px; border-radius: 12px; background: #24233D; color: #9C96FF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; font-size: 14px; font-weight: 600; color: #C9C8DE">{{r.label}}</span>
<span style="font-size: 14px; font-weight: 700">{{r.value}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A2BD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
</a>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; display: flex; gap: 10px; background: #1A1930">
<button aria-label="Scan receipt" style="width: 56px; height: 56px; border-radius: 18px; background: #24233D; border: 0; color: #9C96FF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8"></path></svg></button>
<a href="ExpenseDetailsDark.dc.html" style="flex: 1; height: 56px; border-radius: 18px; background: #635BDB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 10px 24px rgba(99,91,219,0.32)">Save expense</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'food' }; }
  renderVals() {
    var self = this, cur = this.state.cat;
    var cats = [
      { id: 'food', label: 'Food', icon: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7' },
      { id: 'stay', label: 'Stay', icon: 'M2 20V6M2 16h20v4M22 16v-4a4 4 0 0 0-4-4h-8v8M6 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4' },
      { id: 'transport', label: 'Transport', icon: 'M5 17H3v-5l2-5h14l2 5v5h-2M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9 17h6' },
      { id: 'fun', label: 'Activities', icon: 'M3 7v3a2 2 0 0 1 0 4v3h18v-3a2 2 0 0 1 0-4V7zM13 7v10' },
      { id: 'shop', label: 'Shopping', icon: 'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0' }
    ].map(function (c) {
      var on = c.id === cur;
      return { label: c.label, icon: c.icon, on: on ? 'true' : 'false', bg: on ? '#635BDB' : '#FFFFFF', fg: on ? '#FFFFFF' : '#C9C8DE', border: on ? '1.5px solid #635BDB' : '1.5px solid #34334F', pick: function () { self.setState({ cat: c.id }); } };
    });
    var rows = [
      { label: 'Paid by', value: 'Maya Chen', href: 'ExpenseDetailsDark.dc.html', icon: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8' },
      { label: 'Split', value: 'Equally · 5', href: 'SplitExpenseDark.dc.html', icon: 'M16 3h5v5M8 3H3v5M21 3l-7 7M3 3l7 7M12 22v-8' },
      { label: 'Date', value: 'Fri, Oct 23', href: 'AddExpenseDark.dc.html', icon: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2' },
      { label: 'Note', value: 'Add', href: 'AddExpenseDark.dc.html', icon: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' }
    ].map(function (r, i, a) { r.line = i < a.length - 1 ? '1px solid #2A2944' : '0'; return r; });
    return { cats: cats, rows: rows };
  }
}
</script>
</body>
</html>
