<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owezy · Analytics (tablet)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7FB}
a{color:#4F46C8}a:hover{color:#3B33A8}
.ow{font-family:Inter,system-ui,-apple-system,sans-serif;color:#16152B;background:#F7F7FB;font-variant-numeric:tabular-nums;container-type:inline-size;min-height:100vh;-webkit-font-smoothing:antialiased}
.ow *{box-sizing:border-box}
.ow button,.ow input,.ow select{font-family:inherit}
.ow button{cursor:pointer}
.sh{display:flex;min-height:100vh}
.sd{width:252px;flex:none;background:#635BDB;color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;color:#fff;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand:hover{color:#fff}
.mark{width:36px;height:36px;border-radius:12px;background:#fff;color:#635BDB;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.nvw{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:2px}
.sect{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.86);padding:0 12px 6px}
.nv{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:14px;color:rgba(255,255,255,.9);text-decoration:none;font-size:14px;font-weight:600}
.nv:hover{background:rgba(255,255,255,.1);color:#fff}
.nv.on{background:rgba(255,255,255,.2);color:#fff;font-weight:700}
.nv svg,.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.up{margin-top:auto;background:rgba(255,255,255,.14);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mn{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.tb{height:72px;background:#fff;border-bottom:1px solid #ECEBF3;display:flex;align-items:center;gap:12px;padding:0 32px}
.srch{flex:1;max-width:420px;height:44px;border:1px solid #ECEBF3;background:#F7F7FB;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#6B6A80;font-size:14px}
.srch input{border:0;background:transparent;outline:0;flex:1;font-size:14px;color:#16152B;min-width:0}
.kbd{font-size:11px;font-weight:700;border:1px solid #DCDAE8;border-radius:6px;padding:2px 6px;color:#6B6A80;background:#fff}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid #ECEBF3;display:grid;place-items:center;color:#16152B;position:relative;text-decoration:none;flex:none}
.ib:hover{background:#F7F7FB;color:#16152B}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#C2410C;box-shadow:0 0 0 2px #fff}
.btn{height:44px;padding:0 18px;border-radius:14px;border:0;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.bp{background:#635BDB;color:#fff;box-shadow:0 8px 20px -8px rgba(99,91,219,.6)}
.bp:hover{background:#544CC9;color:#fff}
.bg{background:#fff;color:#16152B;border:1px solid #DCDAE8}
.bg:hover{background:#F7F7FB;color:#16152B}
.me{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid #ECEBF3;text-decoration:none;color:#16152B}
.me:hover{color:#16152B}
.mt{display:flex;flex-direction:column;line-height:1.3}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.ct{padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px;width:100%;max-width:1400px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.h1{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:0}
.sub{font-size:14px;color:#6B6A80;margin:4px 0 0;font-weight:500}
.cd{background:#fff;border:1px solid #ECEBF3;border-radius:24px;padding:20px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.h3{font-size:17px;font-weight:700;letter-spacing:-.2px;margin:0}
.cap{font-size:12px;font-weight:500;color:#6B6A80}
.g{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.seg{display:inline-flex;background:#F0EFF6;padding:4px;border-radius:14px;gap:2px}
.seg button{height:34px;border:0;background:transparent;border-radius:11px;padding:0 14px;font-size:13px;font-weight:700;color:#6B6A80}
.seg button.on{background:#fff;color:#4F46C8;box-shadow:0 1px 3px rgba(22,21,43,.14)}
.bd{font-size:11px;font-weight:700;padding:4px 9px;border-radius:10px;display:inline-block;white-space:nowrap}
.bd-g{background:#E6F5EE;color:#12805A}.bd-o{background:#FFF0E6;color:#B43C0B}.bd-p{background:#EEEDFC;color:#4F46C8}
.row{display:flex;align-items:center;gap:12px}
.stat{background:#fff;border:1px solid #ECEBF3;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.6px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ins{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F2F1F7}
.ins:last-child{border-bottom:0}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
@container (max-width:1180px){.sd{width:84px;padding:22px 12px}.lb,.sect,.up{display:none}.nv{justify-content:center;padding:0}.brand{justify-content:center;padding:2px 0}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}.ct{padding:24px}.tb{padding:0 24px}.hide-t{display:none}}
@container (max-width:720px){.sh{flex-direction:column}.sd{width:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:6px}.nvw,.sec{flex-direction:row;gap:2px}.nv{width:44px;flex:none}.g4{grid-template-columns:minmax(0,1fr)}.ct{padding:16px}.tb{padding:0 16px}.hide-m{display:none}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7FB}
</style>
<script src="owezy-runtime.js"></script>
</head>
<body>
<div id="dc-root" data-props-override='{}'></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="width: 834px; min-height: 2300px; background: #F7F7FB; font-family: Inter, system-ui, sans-serif; color: #16152B">
<div class="ow">
<div class="sh">
<aside class="sd">
<a class="brand" href="Main.dc.html"><span class="mark">O</span><span class="lb">Owezy</span></a>
<nav class="nvw" aria-label="Main">
<template data-sc="for" list="{{nav}}" as="s" hint-placeholder-count="3">
<div class="sec"><div class="sect">{{s.t}}</div>
<template data-sc="for" list="{{s.items}}" as="it" hint-placeholder-count="4">
<a class="{{it.cls}}" href="{{it.href}}" aria-label="{{it.l}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{it.d}}"></path></svg><span class="lb">{{it.l}}</span></a>
</template>
</div>
</template>
</nav>
<div class="up"><div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"></path></svg>Owezy Premium</div><div style="font-size:12px;line-height:1.5;color:rgba(255,255,255,.9)">Receipt scanning, exports and unlimited groups.</div><a class="btn" href="Premium.dc.html" style="height:38px;background:#fff;color:#4F46C8">Upgrade</a></div>
</aside>
<main class="mn">
<header class="tb">
<label class="srch"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg><input placeholder="Search expenses, groups, people" aria-label="Search"><span class="kbd hide-m">⌘K</span></label>
<div style="flex:1"></div>
<a class="ib" href="Activity.dc.html" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span class="dot"></span></a>
<a class="btn bp" href="AddExpense.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span class="hide-m">Add expense</span></a>
<a class="me" href="Settings.dc.html"><span class="av" style="width:40px;height:40px;background:#635BDB;font-size:14px">AM</span><span class="mt hide-t"><b style="font-size:14px">Alex Morgan</b><span class="cap">Free plan</span></span></a>
</header>
<div class="ct">
<div class="ph">
<div><h1 class="h1">Insights</h1><p class="sub">{{period}} · your share of spending</p></div>
<div class="row" style="gap:10px"><div class="seg" role="group" aria-label="Range"><button class="{{c6}}" onClick="{{set6}}">6M</button><button class="{{c12}}" onClick="{{set12}}">1Y</button></div><a class="btn bg" href="Reports.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Export</a></div>
</div>

<div class="g g4">
<div class="stat"><span class="cap" style="font-weight:600">Total spent</span><span class="v">{{k.tot}}</span><span class="row" style="gap:6px"><span class="bd bd-o">{{k.delta}}</span><span class="cap">vs previous</span></span></div>
<div class="stat"><span class="cap" style="font-weight:600">Monthly average</span><span class="v">{{k.avg}}</span><span class="cap">Budget $1,800</span></div>
<div class="stat"><span class="cap" style="font-weight:600">Top category</span><span class="v">Food</span><span class="cap">$2,882 · 30% of spend</span></div>
<div class="stat"><span class="cap" style="font-weight:600">Biggest month</span><span class="v">October</span><span class="cap">$2,860 · Lisbon Trip</span></div>
</div>

<div class="g g21">
<section class="cd">
<div class="ch"><div><h2 class="h3">Monthly spending</h2><div class="cap" style="margin-top:2px">{{period}}</div></div><span class="bd bd-g">Nov on track · 66% of budget</span></div>
<div style="display:flex;gap:10px;height:250px">
<div style="display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:600;color:#6B6A80;width:30px;text-align:right;margin:-7px 0"><span>$3k</span><span>$2k</span><span>$1k</span><span>$0</span></div>
<div style="position:relative;flex:1">
<svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
<path d="M0 0H600M0 66.7H600M0 133.3H600" stroke="#ECEBF3" style="stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 4"></path>
<path d="M0 80H600" stroke="#E8763A" style="stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:6 5"></path>
<path d="M0 200H600" stroke="#DCDAE8" style="stroke-width:1;vector-effect:non-scaling-stroke"></path>
<path d="{{ch.area}}" fill="#635BDB" style="fill-opacity:.1"></path>
<path d="{{ch.line}}" fill="none" stroke="#4F46C8" style="stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round"></path>
</svg>
<span style="position:absolute;right:0;top:40%;transform:translateY(-120%);font-size:11px;font-weight:700;color:#B43C0B;background:#fff;padding:0 4px">Budget $1.8k</span>
<div style="position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #4F46C8;transform:translate(-50%,-50%);left: {{ch.pk.l}}%; top: {{ch.pk.t}}%"></div>
<div style="position:absolute;transform:translate(-50%,-100%);margin-top:-14px;background:#16152B;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;left: {{ch.pk.l}}%; top: {{ch.pk.t}}%">{{ch.pk.m}} · {{ch.pk.v}}</div>
</div>
</div>
<div style="display:grid;margin:10px 0 0 40px;font-size:11px;font-weight:600;color:#6B6A80;text-align:center;grid-template-columns: repeat({{ch.n}}, minmax(0,1fr))"><template data-sc="for" list="{{ch.labels}}" as="m" hint-placeholder-count="6"><span>{{m.m}}</span></template></div>
</section>

<section class="cd">
<div class="ch"><h2 class="h3">By category</h2><span class="cap">Jun – Nov</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:18px">
<div style="position:relative;width:170px;height:170px">
<svg viewBox="0 0 120 120" role="img" aria-label="Spending by category, June to November" style="width:100%;height:100%">
<circle cx="60" cy="60" r="46" fill="none" stroke="#635BDB" transform="rotate(-90 60 60)" style="stroke-width:16;stroke-dasharray: {{dn.d0.da}}; stroke-dashoffset: {{dn.d0.off}}"></circle>
<circle cx="60" cy="60" r="46" fill="none" stroke="#14A3A3" transform="rotate(-90 60 60)" style="stroke-width:16;stroke-dasharray: {{dn.d1.da}}; stroke-dashoffset: {{dn.d1.off}}"></circle>
<circle cx="60" cy="60" r="46" fill="none" stroke="#F08A3C" transform="rotate(-90 60 60)" style="stroke-width:16;stroke-dasharray: {{dn.d2.da}}; stroke-dashoffset: {{dn.d2.off}}"></circle>
<circle cx="60" cy="60" r="46" fill="none" stroke="#E25C9A" transform="rotate(-90 60 60)" style="stroke-width:16;stroke-dasharray: {{dn.d3.da}}; stroke-dashoffset: {{dn.d3.off}}"></circle>
<circle cx="60" cy="60" r="46" fill="none" stroke="#4BA3F2" transform="rotate(-90 60 60)" style="stroke-width:16;stroke-dasharray: {{dn.d4.da}}; stroke-dashoffset: {{dn.d4.off}}"></circle>
</svg>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="cap">Total</span><b style="font-size:18px;font-weight:800">$9,476</b></div>
</div>
<div style="width:100%;display:flex;flex-direction:column;gap:10px">
<template data-sc="for" list="{{cats}}" as="c" hint-placeholder-count="5">
<div class="row" style="gap:10px;font-size:13px"><span style="width:10px;height:10px;border-radius:3px;flex:none;background: {{c.c}}"></span><span style="flex:1;font-weight:600">{{c.n}}</span><span class="cap" style="font-weight:600">{{c.p}}</span><b style="width:60px;text-align:right;font-weight:800">{{c.v}}</b></div>
</template>
</div>
</div>
</section>
</div>

<div class="g g21">
<section class="cd">
<div class="ch"><div><h2 class="h3">Spending trends</h2><div class="cap" style="margin-top:2px">Category mix per month</div></div>
<div class="lg"><template data-sc="for" list="{{cats}}" as="c" hint-placeholder-count="5"><span><i style="background: {{c.c}}"></i>{{c.n}}</span></template></div></div>
<div style="display:flex;gap:10px;height:240px">
<div style="display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:600;color:#6B6A80;width:30px;text-align:right;margin:-7px 0 22px"><span>$3k</span><span>$2k</span><span>$1k</span><span>$0</span></div>
<div style="flex:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px">
<template data-sc="for" list="{{stack}}" as="m" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;gap:8px;min-width:0">
<div style="flex:1;display:flex;justify-content:center;border-bottom:1px solid #DCDAE8">
<div title="{{m.t}}" style="width:60%;max-width:48px;display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start">
<template data-sc="for" list="{{m.seg}}" as="s" hint-placeholder-count="5"><div style="border-radius:4px;height: {{s.h}}%; background: {{s.c}}"></div></template>
</div>
</div>
<span style="font-size:12px;font-weight:600;text-align:center;color:#6B6A80;height:14px">{{m.m}}</span>
</div>
</template>
</div>
</div>
</section>

<section class="cd">
<div class="ch"><h2 class="h3">By weekday</h2><span class="cap">Avg per day</span></div>
<div style="display:flex;align-items:flex-end;gap:10px;height:200px">
<template data-sc="for" list="{{wd}}" as="d" hint-placeholder-count="7">
<div style="flex:1;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px">
<span style="font-size:11px;font-weight:700;color: {{d.tc}}">{{d.v}}</span>
<div style="flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center"><div style="width:100%;max-width:26px;border-radius:8px;height: {{d.h}}%; background: {{d.c}}"></div></div>
<span style="font-size:11px;font-weight:600;color:#6B6A80">{{d.l}}</span>
</div>
</template>
</div>
<div class="row" style="margin-top:16px;padding:12px 14px;border-radius:16px;background:#F4F3FE;gap:10px;font-size:13px;font-weight:600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:#4F46C8"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.2 0-4 2.5-4 6v4h4"></path></svg>Fridays cost 2.9× a Tuesday</div>
</section>
</div>

<div class="g g21">
<section class="cd">
<div class="ch"><h2 class="h3">Group spending</h2><span class="cap">Your share, Jun – Nov</span></div>
<div style="display:flex;flex-direction:column;gap:16px">
<template data-sc="for" list="{{grp}}" as="g" hint-placeholder-count="5">
<div style="display:grid;grid-template-columns:150px minmax(0,1fr) 80px;align-items:center;gap:14px">
<span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{g.n}}</span>
<div style="height:14px;border-radius:6px;background:#F2F1F7;overflow:hidden"><div style="height:100%;border-radius:6px;width: {{g.w}}%; background: {{g.c}}"></div></div>
<b style="text-align:right;font-weight:800;font-size:14px">{{g.v}}</b>
</div>
</template>
</div>
</section>
<section class="cd">
<div class="ch" style="margin-bottom:6px"><h2 class="h3">Highlights</h2></div>
<div class="ins"><div class="tile" style="background:#FFF0E6;color:#B4500B"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg></div><div><div style="font-size:14px;font-weight:700">October ran 59% over budget</div><div class="cap">Travel was $1,460 of it</div></div></div>
<div class="ins"><div class="tile" style="background:#E6F5EE;color:#12805A"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l6 6 4-4 8 8M15 17h6v-6"></path></svg></div><div><div style="font-size:14px;font-weight:700">Groceries down 20% since Sep</div><div class="cap">$152 so far in November</div></div></div>
<div class="ins"><div class="tile" style="background:#EEEDFC;color:#4F46C8"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path></svg></div><div><div style="font-size:14px;font-weight:700">Rent &amp; bills steady</div><div class="cap">$400–410 a month</div></div></div>
</section>
</div>
</div>
</main>
</div>
</div>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic" data-props='{"$preview":{"width":1440,"height":1380}}'>

const P={home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',grp:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',rcp:'M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6M9 16h3',bal:'M7 7h13l-4-4M17 17H4l4 4',stl:'M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2M16 14.5h.01',act:'M3 12h4l3-8 4 16 3-8h4',bud:'M12 3a9 9 0 1 0 9 9h-9zM15 3.5A9 9 0 0 1 20.5 9H15z',ana:'M4 20V12M10 20V5M16 20v-9M21 20H3',rep:'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6',set:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',prm:'M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z'};
const NAV=[['Overview',[['Dashboard','Main','home'],['Groups','Groups','grp'],['Expenses','Expenses','rcp'],['Balances','Balances','bal'],['Settlements','Settlements','stl'],['Activity','Activity','act']]],['Planning',[['Budgets','Budgets','bud'],['Analytics','Analytics','ana'],['Reports','Reports','rep']]],['Account',[['Settings','Settings','set'],['Premium','Premium','prm']]]];
const nav=a=>NAV.map(([t,x])=>({t,items:x.map(([l,f,k])=>({l,href:f+'.dc.html',d:P[k],cls:f===a?'nv on':'nv'}))}));
function smooth(p){let d='M'+p[0][0]+','+p[0][1];for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=' C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+','+(b[1]+(c[1]-a[1])/6).toFixed(1)+' '+(c[0]-(e[0]-b[0])/6).toFixed(1)+','+(c[1]-(e[1]-b[1])/6).toFixed(1)+' '+c[0]+','+c[1];}return d;}
function chart(data){const n=data.length,W=600,H=200;const p=data.map((d,i)=>[+((i+.5)*W/n).toFixed(1),+(H-d[1]/3000*H).toFixed(1)]);const line=smooth(p);let k=0;data.forEach((d,i)=>{if(d[1]>data[k][1])k=i;});return{n,line,area:line+' L'+p[n-1][0]+','+H+' L'+p[0][0]+','+H+' Z',labels:data.map(d=>({m:d[0]})),pk:{l:(p[k][0]/W*100).toFixed(2),t:(p[k][1]/H*100).toFixed(2),m:data[k][0],v:'$'+data[k][1].toLocaleString('en-US')}};}
function donut(v){const C=2*Math.PI*46,T=v.reduce((a,b)=>a+b,0);let acc=0;const o={};v.forEach((x,i)=>{const L=x/T*C;o['d'+i]={da:Math.max(L-3,0).toFixed(2)+' '+C.toFixed(2),off:(-acc).toFixed(2)};acc+=L;});return o;}

ch:chart(r==='6M'?M6:M12),c6:r==='6M'?'on':'',c12:r==='1Y'?'on':'',
set6:()=>this.setState({range:'6M'}),set12:()=>this.setState({range:'1Y'}),

cats:CN.map((n,i)=>({n,c:CC[i],v:usd(tot[i]),p:Math.round(tot[i]/9476*100)+'%'})),
stack:Object.keys(ST).map(m=>({m,t:m+' · '+usd(ST[m].reduce((a,b)=>a+b,0)),seg:ST[m].map((v,i)=>({h:(v/3000*100).toFixed(2),c:CC[i]}))})),
wd:W.map(d=>({l:d[0].slice(0,1),v:'$'+d[1],h:(d[1]/78*100).toFixed(0),c:d[0]==='Fri'?'#635BDB':'#DCDAF5',tc:d[0]==='Fri'?'#4F46C8':'#6B6A80'})),
grp:G.map(g=>({n:g[0],v:usd(g[1]),c:g[2],w:(g[1]/649.72*100).toFixed(1)}))};
