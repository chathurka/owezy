<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owezy · Design system</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4F46C8}a:hover{color:#3B33A8}
.ds{--bg:#F7F7FB;--surface:#FFFFFF;--surface-raised:#FFFFFF;--surface-sunken:#F7F7FB;--border:#ECEBF3;--border-strong:#DCDAE8;--divider:#F2F1F7;--track:#F0EFF6;--text:#16152B;--text-muted:#6B6A80;--text-subtle:#9A99AD;--primary:#635BDB;--primary-hover:#544CC9;--primary-text:#4F46C8;--primary-soft:#EEEDFC;--on-primary:#FFFFFF;--sidebar:#635BDB;--sidebar-active:rgba(255,255,255,.20);--hero:#635BDB;--hero-tile:rgba(255,255,255,.14);--owed:#12805A;--owed-soft:#E6F5EE;--owe:#C2410C;--owe-soft:#FFF0E6;--warning-text:#8A3208;--inverse:#16152B;--on-inverse:#FFFFFF;--chart-pos:#2E9B6F;--chart-neg:#E8763A;--chart-muted:#DCDAF5;--grid:#ECEBF3;--c1:#635BDB;--c2:#14A3A3;--c3:#F08A3C;--c4:#E25C9A;--c5:#4BA3F2;--food-bg:#EEEDFC;--food-fg:#4F46C8;--travel-bg:#E3F5F5;--travel-fg:#0B7C7C;--bills-bg:#FFF0E6;--bills-fg:#B4500B;--groc-bg:#FCE9F2;--groc-fg:#B5336F;--fun-bg:#E6F2FD;--fun-fg:#23679F;--sh-hero:0 20px 40px -20px rgba(99,91,219,.75);--sh-float:0 20px 40px -24px rgba(22,21,43,.35);--sh-primary:0 8px 20px -8px rgba(99,91,219,.6);--sh-seg:0 1px 3px rgba(22,21,43,.14);--sh-hover:0 14px 30px -18px rgba(99,91,219,.55);--sh-modal:0 40px 80px -30px rgba(22,21,43,.55)}
.ds.dark{--bg:#0F0E1A;--surface:#17162A;--surface-raised:#201F36;--surface-sunken:#121124;--border:#2A2944;--border-strong:#3A3858;--divider:#222137;--track:#232238;--text:#F2F1FA;--text-muted:#A3A2BC;--text-subtle:#6E6D88;--primary:#635BDB;--primary-hover:#7069E3;--primary-text:#A7A2FF;--primary-soft:#2A2758;--on-primary:#FFFFFF;--sidebar:#2B2770;--sidebar-active:rgba(255,255,255,.14);--hero:#4F48C9;--hero-tile:rgba(255,255,255,.12);--owed:#5BD69B;--owed-soft:#12352A;--owe:#FF9A5C;--owe-soft:#3A2318;--warning-text:#FFB98A;--inverse:#F2F1FA;--on-inverse:#16152B;--chart-pos:#3FBF85;--chart-neg:#F08A4B;--chart-muted:#34325A;--grid:#2A2944;--c1:#8A84F5;--c2:#2CC4C4;--c3:#F59A55;--c4:#EC74AA;--c5:#6DB6F5;--food-bg:#2A2758;--food-fg:#A7A2FF;--travel-bg:#123536;--travel-fg:#5ED6D6;--bills-bg:#3A2318;--bills-fg:#FFAF7A;--groc-bg:#3A1A2B;--groc-fg:#F28DBB;--fun-bg:#15293F;--fun-fg:#8CC6F7;--sh-hero:0 20px 40px -24px rgba(0,0,0,.8);--sh-float:0 20px 40px -20px rgba(0,0,0,.7);--sh-primary:0 8px 20px -10px rgba(99,91,219,.7);--sh-seg:0 1px 2px rgba(0,0,0,.5);--sh-hover:0 14px 30px -18px rgba(0,0,0,.8);--sh-modal:0 40px 80px -30px rgba(0,0,0,.9)}
.ds{width:1440px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:64px 72px 80px;box-sizing:border-box;display:flex;flex-direction:column;gap:56px}
.ds *{box-sizing:border-box}
.ds button,.ds input{font-family:inherit}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:12px}
.mu{color:var(--text-muted)}
.cap{font-size:12px;font-weight:500;color:var(--text-muted)}
.sec{display:flex;flex-direction:column;gap:24px}
.sh{display:flex;align-items:baseline;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--border-strong)}
.sh .n{font-size:13px;font-weight:800;color:var(--primary-text);letter-spacing:.5px}
.sh h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.8px}
.sh p{margin:0 0 0 auto;font-size:14px;color:var(--text-muted);font-weight:500}
.sub{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);margin:0 0 12px}
.sw{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}
.swc{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.swc .chip{height:72px;border-bottom:1px solid var(--border)}
.swc .m{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.swc b{font-size:13px;font-weight:700}
.swc code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-muted)}
.cd{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:22px}
.pn{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px}
.pn h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.pn h3 span{font-size:12px;font-weight:500;color:var(--text-muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.span2{grid-column:span 2}
.btn{height:44px;padding:0 18px;border-radius:14px;border:0;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.bp{background:var(--primary);color:var(--on-primary);box-shadow:var(--sh-primary)}
.bs{background:var(--primary-soft);color:var(--primary-text)}
.bg{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}
.ib{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text);position:relative;padding:0}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--owe);box-shadow:0 0 0 2px var(--surface)}
.chp{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chp.on{background:var(--inverse);color:var(--on-inverse);border-color:var(--inverse)}
.chp.cat{height:40px;padding:0 14px 0 10px}
.chp.cat.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seg{display:inline-flex;background:var(--track);padding:4px;border-radius:14px;gap:2px}
.seg button{height:34px;border:0;background:transparent;border-radius:11px;padding:0 14px;font-size:13px;font-weight:700;color:var(--text-muted)}
.seg button.on{background:var(--surface-raised);color:var(--primary-text);box-shadow:var(--sh-seg)}
.ut{display:flex;gap:22px;border-bottom:1px solid var(--border-strong)}
.ut button{background:none;border:0;padding:0 0 12px;font-size:14px;font-weight:600;color:var(--text-muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.ut button.on{color:var(--primary-text);font-weight:700;border-bottom-color:var(--primary)}
.inp{height:52px;border-radius:16px;border:1.5px solid var(--border-strong);padding:0 16px;font-size:15px;font-weight:600;color:var(--text);background:var(--surface-raised);outline:0;width:100%}
.inp.fx{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.fl{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:var(--text-muted)}
.tg{width:48px;height:28px;border-radius:14px;border:0;padding:3px;display:flex;background:var(--border-strong);flex:none}
.tg.on{background:var(--primary);justify-content:flex-end}
.tg span{width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bd{font-size:11px;font-weight:700;padding:4px 9px;border-radius:10px;display:inline-block;white-space:nowrap}
.bd-g{background:var(--owed-soft);color:var(--owed)}.bd-o{background:var(--owe-soft);color:var(--owe)}.bd-p{background:var(--primary-soft);color:var(--primary-text)}.bd-n{background:var(--track);color:var(--text-muted)}
.av{border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font-weight:700;flex:none}
.stk{display:flex}.stk .av{margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}.stk .av:first-child{margin-left:0}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.pb{height:8px;border-radius:4px;background:var(--divider);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--divider)}
.li:last-child{border-bottom:0}
.amt{text-align:right}.amt b{display:block;font-size:15px;font-weight:700}.amt span{font-size:11px;color:var(--text-muted);font-weight:500}
.pos{color:var(--owed)}.neg{color:var(--owe)}
.nv{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:14px;color:rgba(255,255,255,.9);font-size:14px;font-weight:600}
.nv.on{background:var(--sidebar-active);color:#FFFFFF;font-weight:700}
.cr{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--border)}
.aa{width:64px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.ts{display:grid;grid-template-columns:150px 200px minmax(0,1fr);align-items:baseline;gap:20px;padding:16px 0;border-bottom:1px solid var(--divider)}
.ts:last-child{border-bottom:0}
.ts code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;color:var(--primary-text)}
</style>
<script src="owezy-runtime.js"></script>
</head>
<body>
<div id="dc-root" data-props-override='{}'></div>
<script type="text/x-dc-template" id="dc-tpl">
<div class="{{rootCls}}">

<header style="display:flex;align-items:flex-end;gap:32px;padding-bottom:8px">
<div style="flex:1;display:flex;flex-direction:column;gap:18px">
<div class="row" style="gap:14px"><span style="width:52px;height:52px;border-radius:16px;background:var(--primary);color:#FFFFFF;display:grid;place-items:center;font-size:26px;font-weight:800;box-shadow:var(--sh-primary)">O</span><span class="{{themeBadge}}" style="font-size:12px;padding:6px 12px">{{themeName}} theme</span></div>
<h1 style="margin:0;font-size:64px;font-weight:800;letter-spacing:-2.4px;line-height:1">Owezy Design System</h1>
<p style="margin:0;font-size:18px;font-weight:500;color:var(--text-muted)">Split it now, settle it later. One set of token names for iOS, Android and web — two themes.</p>
</div>
<div class="cd" style="display:grid;grid-template-columns:repeat(2,auto);gap:10px 28px;font-size:13px;padding:18px 22px">
<span class="mu" style="font-weight:600">Version</span><b>1.0 · Nov 2026</b>
<span class="mu" style="font-weight:600">Typeface</span><b>Inter 400–800</b>
<span class="mu" style="font-weight:600">Grid</span><b>4px base</b>
<span class="mu" style="font-weight:600">Icons</span><b>24 outline · 1.9 stroke</b>
</div>
</header>

<section class="sec">
<div class="sh"><span class="n">01</span><h2>Colour</h2><p>Same token names in both themes — only values change</p></div>
<template data-sc="for" list="{{groups}}" as="g" hint-placeholder-count="6">
<div>
<div class="sub">{{g.t}}</div>
<div class="sw">
<template data-sc="for" list="{{g.items}}" as="t" hint-placeholder-count="8">
<div class="swc"><div class="chip" style="background: {{t.v}}"></div><div class="m"><b>{{t.n}}</b><code>{{t.v}}</code></div></div>
</template>
</div>
</div>
</template>
<div>
<div class="sub">Category tiles</div>
<div class="row" style="gap:14px">
<div class="cr" style="background:var(--surface)"><div class="tile" style="background:var(--food-bg);color:var(--food-fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.2 0-4 2.5-4 6v4h4"></path></svg></div><div><b style="font-size:13px">Food</b><div class="cap">cat-food</div></div></div>
<div class="cr" style="background:var(--surface)"><div class="tile" style="background:var(--travel-bg);color:var(--travel-fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11H4zM9 8V5h6v3M4 13h16"></path></svg></div><div><b style="font-size:13px">Travel</b><div class="cap">cat-travel</div></div></div>
<div class="cr" style="background:var(--surface)"><div class="tile" style="background:var(--bills-bg);color:var(--bills-fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 8-10h-6z"></path></svg></div><div><b style="font-size:13px">Rent &amp; bills</b><div class="cap">cat-bills</div></div></div>
<div class="cr" style="background:var(--surface)"><div class="tile" style="background:var(--groc-bg);color:var(--groc-fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.3M9.5 20h.01M17 20h.01"></path></svg></div><div><b style="font-size:13px">Groceries</b><div class="cap">cat-groceries</div></div></div>
<div class="cr" style="background:var(--surface)"><div class="tile" style="background:var(--fun-bg);color:var(--fun-fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4zM14 6v12"></path></svg></div><div><b style="font-size:13px">Entertainment</b><div class="cap">cat-fun</div></div></div>
</div>
</div>
<div>
<div class="sub">Contrast checks · {{themeName}}</div>
<div class="g3" style="gap:12px">
<template data-sc="for" list="{{pairs}}" as="p" hint-placeholder-count="12">
<div class="cr" style="background:var(--surface)">
<div class="aa" style="background: {{p.bg}}; color: {{p.fg}}; border: 1px solid var(--border)">Aa</div>
<div style="flex:1;min-width:0"><b style="font-size:13px">{{p.n}}</b><div class="cap">{{p.d}}</div></div>
<div style="text-align:right"><b style="font-size:15px;font-weight:800">{{p.r}}</b><div><span class="{{p.bc}}">{{p.bl}}</span></div></div>
</div>
</template>
</div>
</div>
</section>

<section class="sec">
<div class="sh"><span class="n">02</span><h2>Typography</h2><p>Inter · tabular figures everywhere</p></div>
<div class="cd" style="padding:6px 24px">
<template data-sc="for" list="{{type}}" as="t" hint-placeholder-count="11">
<div class="ts"><code>{{t.n}}</code><span class="cap" style="font-size:13px">{{t.spec}}</span><span style="font-size: {{t.fs}}px; font-weight: {{t.fw}}; letter-spacing: {{t.ls}}px; text-transform: {{t.tt}}; line-height: 1.15">{{t.s}}</span></div>
</template>
</div>
</section>

<section class="sec">
<div class="sh"><span class="n">03</span><h2>Space, shape &amp; depth</h2><p>4px grid · radius grows with size</p></div>
<div class="g3">
<div class="pn"><h3>Spacing <span>space-*</span></h3>
<template data-sc="for" list="{{space}}" as="s" hint-placeholder-count="9">
<div class="row" style="gap:14px"><code style="font-family:ui-monospace,Menlo,monospace;font-size:12px;width:78px;color:var(--text-muted)">{{s.n}}</code><div style="height:14px;border-radius:4px;background:var(--primary);width: {{s.v}}px"></div><b style="font-size:13px">{{s.v}}</b></div>
</template>
</div>
<div class="pn"><h3>Radius <span>radius-*</span></h3>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">
<template data-sc="for" list="{{radii}}" as="r" hint-placeholder-count="9">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:72px;height:56px;background:var(--primary-soft);border:2px solid var(--primary);border-radius: {{r.v}}px"></div><span style="font-size:12px;font-weight:700">{{r.n}}</span><span class="cap" style="font-size:11px">{{r.u}}</span></div>
</template>
</div>
</div>
<div class="pn"><h3>Elevation <span>shadow-*</span></h3>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:8px">
<div style="height:76px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:700">Border only</div>
<div style="height:76px;border-radius:18px;background:var(--surface-raised);box-shadow:var(--sh-seg);display:grid;place-items:center;font-size:12px;font-weight:700">segment</div>
<div style="height:76px;border-radius:18px;background:var(--surface-raised);box-shadow:var(--sh-float);display:grid;place-items:center;font-size:12px;font-weight:700">floating</div>
<div style="height:76px;border-radius:18px;background:var(--hero);color:#FFFFFF;box-shadow:var(--sh-hero);display:grid;place-items:center;font-size:12px;font-weight:700">hero</div>
<div style="height:76px;border-radius:18px;background:var(--primary);color:#FFFFFF;box-shadow:var(--sh-primary);display:grid;place-items:center;font-size:12px;font-weight:700">primary</div>
<div style="height:76px;border-radius:18px;background:var(--surface-raised);box-shadow:var(--sh-modal);display:grid;place-items:center;font-size:12px;font-weight:700">modal</div>
</div>
<p class="cap" style="margin:0;line-height:1.5">{{elevNote}}</p>
</div>
</div>
</section>

<section class="sec">
<div class="sh"><span class="n">04</span><h2>Components</h2><p>Built only from the tokens above</p></div>
<div class="g3">

<div class="pn"><h3>Buttons <span>44 · 56 CTA</span></h3>
<div class="row" style="flex-wrap:wrap;gap:10px"><button class="btn bp"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add expense</button><button class="btn bs">Settle up</button><button class="btn bg">Export</button></div>
<button class="btn bp" style="height:56px;border-radius:18px;font-size:16px;width:100%">Record $145.00 payment</button>
<div class="row" style="background:var(--hero);border-radius:18px;padding:12px;gap:10px"><button class="btn" style="background:var(--surface);color:var(--primary-text)">View balances</button><button class="btn" style="background:var(--hero-tile);color:#FFFFFF">Settle up</button></div>
<div class="row" style="gap:10px"><button class="btn bp" style="opacity:.45;box-shadow:none">Disabled</button><button class="btn bp" style="box-shadow:0 0 0 4px var(--primary-soft),0 0 0 1.5px var(--primary)">Focused</button></div>
</div>

<div class="pn"><h3>Chips &amp; segments</h3>
<div class="row" style="flex-wrap:wrap;gap:8px"><span class="chp on">All 10</span><span class="chp">Expenses</span><span class="chp">Payments</span><span class="chp">Updates</span></div>
<div class="row" style="flex-wrap:wrap;gap:8px"><span class="chp cat on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.2 0-4 2.5-4 6v4h4"></path></svg>Food</span><span class="chp cat"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M4 8h16v11H4zM9 8V5h6v3M4 13h16"></path></svg>Travel</span><span class="chp cat"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M3 4h2l2.4 11h10.2L20 8H6.3M9.5 20h.01M17 20h.01"></path></svg>Groceries</span></div>
<div class="seg"><button class="on">Equal</button><button>Exact</button><button>Percent</button><button>Shares</button></div>
<div class="ut"><button class="on">Expenses</button><button>Balances</button><button>Members</button></div>
</div>

<div class="pn"><h3>Inputs</h3>
<label class="fl">Description<input class="inp fx" value="Dinner at Time Out Market"></label>
<label class="fl">Note<input class="inp" placeholder="Add a note (optional)"></label>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px"><div class="row" style="gap:4px"><span style="font-size:30px;font-weight:700;color:var(--text-muted)">$</span><span style="font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1">186.50</span></div><span style="background:var(--primary-soft);color:var(--primary-text);font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px">$37.30 per person · 5 people</span></div>
</div>

<div class="pn"><h3>Icon buttons &amp; switches</h3>
<div class="row" style="gap:12px">
<button class="ib" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span class="dot"></span></button>

<div class="pn"><h3>Money</h3><div style="font-size:14px;line-height:1.6;color:var(--text-muted)"><b class="pos">+$486.20 · you’re owed</b> — owed, received, you lent.<br><b class="neg">−$42.50 · you owe</b> — owe, borrowed.<br><b style="color:var(--text)">$186.50</b> — what something cost.<br>Never colour alone: sign or label always.</div></div>
<div class="pn"><h3>Dark mode</h3><div style="font-size:14px;line-height:1.6;color:var(--text-muted)">Same token names; never branch per theme. <b style="color:var(--text)">primary</b> stays #635BDB for fills; violet text uses <b style="color:var(--primary-text)">primary-text</b>. Sidebar and hero deepen. Depth comes from bg → surface → surface-raised.</div></div>
<div class="pn"><h3>Accessibility</h3><div style="font-size:14px;line-height:1.6;color:var(--text-muted)">Text ≥ 4.5:1 in both themes (3:1 for 24px+ figures and icons). 44 × 44 targets. Focus = 1.5px primary + 4px primary-soft ring. Icon-only buttons are labelled.</div></div>

['Brand',[['primary','#635BDB','#635BDB'],['primary-hover','#544CC9','#7069E3'],['primary-text','#4F46C8','#A7A2FF'],['primary-soft','#EEEDFC','#2A2758'],['sidebar','#635BDB','#2B2770'],['hero','#635BDB','#4F48C9']]],
['Money',[['owed','#12805A','#5BD69B'],['owed-soft','#E6F5EE','#12352A'],['owe','#C2410C','#FF9A5C'],['owe-soft','#FFF0E6','#3A2318'],['warning-text','#8A3208','#FFB98A']]],

function lum(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255].map(c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}).reduce((a,c,i)=>a+c*[0.2126,0.7152,0.0722][i],0);}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
const PAIRS=[['text','surface','Body text'],['text-muted','surface','Meta on cards'],['text-muted','bg','Meta on page'],['primary-text','surface','Links, active tab'],['owed','surface','Owed amounts'],['owe','surface','Owe amounts'],['on-primary','primary','Button label'],['on-primary','sidebar','Sidebar nav'],['on-primary','hero','Hero figures'],['owed','owed-soft','Settled badge'],['owe','owe-soft','Owes badge'],['primary-text','primary-soft','Secondary button']];
function smooth(p){let d='M'+p[0][0]+','+p[0][1];for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=' C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+','+(b[1]+(c[1]-a[1])/6).toFixed(1)+' '+(c[0]-(e[0]-b[0])/6).toFixed(1)+','+(c[1]-(e[1]-b[1])/6).toFixed(1)+' '+c[0]+','+c[1];}return d;}
function donut(v){const C=2*Math.PI*46,S=v.reduce((a,b)=>a+b,0);let acc=0;const o={};v.forEach((x,i)=>{const L=x/S*C;o['d'+i]={da:Math.max(L-3,0).toFixed(2)+' '+C.toFixed(2),off:(-acc).toFixed(2)};acc+=L;});return o;}

const space=[['space-1',4],['space-2',8],['space-3',12],['space-3-5',14],['space-4',16],['space-5',20],['space-6',24],['space-8',32],['space-12',48]].map(s=>({n:s[0],v:s[1]}));
const radii=[['radius-8',8,'steppers'],['radius-12',12,'small tiles'],['radius-14',14,'icon buttons'],['radius-16',16,'inputs'],['radius-18',18,'CTA, list cards'],['radius-22',22,'group cards'],['radius-24',24,'content cards'],['radius-28',28,'hero, modal'],['radius-pill',28,'chips']].map(r=>({n:r[0],v:r[1],u:r[2]}));
const M=[1240,1380,1520,1290,2860,1186];const pts=M.map((v,i)=>[+((i+.5)*100).toFixed(1),+(200-v/3000*200).toFixed(1)]);const line=smooth(pts);

div:[['Maya',312.4],['Leo',268.1],['Priya',256],['Sana',-145],['Jordan',-70]].map(d=>({n:d[0],wl:d[1]<0?(-d[1]/312.4*100).toFixed(1):0,wr:d[1]>0?(d[1]/312.4*100).toFixed(1):0,cls:d[1]>0?'pos':'neg',v:(d[1]>0?'+$':'−$')+Math.abs(d[1]).toFixed(2)})),
