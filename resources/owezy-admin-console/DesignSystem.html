<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owezy Design System (light)</title>
<link rel="icon" href="assets/icons/owezy-mark.svg" type="image/svg+xml">
<script src="assets/dc-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-template">

<helmet>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
body{margin:0}
.ow-app{--bg:#F6F5FB;--surface:#FFFFFF;--raised:#FFFFFF;--sunken:#F1F0F7;--border:#E9E7F2;--border-strong:#D9D6E6;--divider:#F0EEF6;--track:#EFEEF5;--text:#15132B;--muted:#5F5C78;--subtle:#6A6782;--primary:#635BDB;--primary-text:#4F47C7;--primary-soft:#EFEEFD;--owed:#087A4F;--owed-fill:#19A672;--owed-soft:#E5F5EE;--owe:#B34C15;--owe-fill:#EE7A30;--owe-soft:#FDEFE5;--danger:#C9303F;--danger-soft:#FCEAEC;--info:#2467C2;--info-soft:#E8F0FC;--inverse:#15132B;--on-inverse:#FFFFFF;--c1:#635BDB;--c2:#1FA595;--c3:#F2A53D;--c4:#E2668A;--c5:#4A8FE2;--cm:#DCD9EC;--grid:#EEECF5;--shadow:0 1px 2px rgba(21,19,43,.04);--hero-shadow:0 18px 40px -16px rgba(99,91,219,.55);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums;min-height:100vh;-webkit-font-smoothing:antialiased}
.ow-app.dark{--bg:#0D0C16;--surface:#16142A;--raised:#1F1C36;--sunken:#110F20;--border:#2A2744;--border-strong:#3A365A;--divider:#221F3A;--track:#1B1932;--text:#F2F1FA;--muted:#A9A6C4;--subtle:#8F8CAB;--primary:#6A62E6;--primary-text:#ABA5FA;--primary-soft:#26224A;--owed:#43CF93;--owed-fill:#43CF93;--owed-soft:#12332A;--owe:#F59A5B;--owe-fill:#F59A5B;--owe-soft:#3A2416;--danger:#F27583;--danger-soft:#3C1A22;--info:#6EA8F2;--info-soft:#172A45;--inverse:#F2F1FA;--on-inverse:#15132B;--c1:#8A83F4;--c2:#3FCDB9;--c3:#F5B65E;--c4:#F08AA8;--c5:#74AEF5;--cm:#34304F;--grid:#26233F;--shadow:none;--hero-shadow:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ov{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--subtle)}
.h2{margin:0;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.5px}
.h3{margin:0;font-size:14px;font-weight:700;color:var(--muted)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;font-weight:500}
.sw{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.sw-chip{height:64px}
.sw-meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.btn{font:inherit;font-size:13px;font-weight:700;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--primary);border-color:var(--primary);color:#FFFFFF;box-shadow:0 6px 16px -6px rgba(99,91,219,.6)}
.btn-s{background:var(--primary-soft);border-color:transparent;color:var(--primary-text)}
.btn-d{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn-f{box-shadow:0 0 0 4px var(--primary-soft);border-color:var(--primary)}
.btn-x{opacity:.45;cursor:not-allowed}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--track);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--owed-soft);color:var(--owed)}.warn{background:var(--owe-soft);color:var(--owe)}.bad{background:var(--danger-soft);color:var(--danger)}.info{background:var(--info-soft);color:var(--info)}.brand{background:var(--primary-soft);color:var(--primary-text)}
.up{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--owed-soft);color:var(--owed)}
.dn{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--danger-soft);color:var(--danger)}
.seg{display:inline-flex;background:var(--track);padding:4px;border-radius:12px;gap:2px}
.seg button{font:inherit;font-size:12px;font-weight:700;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--raised);color:var(--primary-text);box-shadow:0 1px 3px rgba(21,19,43,.12)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border-strong)}
.tabs span{font-size:14px;font-weight:600;color:var(--muted);padding-bottom:12px;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--primary-text);font-weight:700;border-bottom-color:var(--primary)}
.tg{width:40px;height:24px;border-radius:999px;border:0;padding:2px;cursor:pointer;display:inline-flex;align-items:center;flex:none}
.tg span{width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(21,19,43,.25);transition:transform .15s}
.tg.on{background:var(--primary)}.tg.on span{transform:translateX(16px)}
.tg.off{background:var(--border-strong)}
.inp{font:inherit;font-size:14px;font-weight:600;color:var(--text);height:44px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);width:100%}
.inp.f{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);outline:none}
.inp.e{border-color:var(--danger)}
.nav-a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.nav-a.on{background:var(--primary-soft);color:var(--primary-text);font-weight:700}
.cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:1px 7px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--sunken);text-align:left;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 16px;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--divider);white-space:nowrap}
.tbl .num{text-align:right}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#FFFFFF;flex:none}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.gsw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width: 1000px){.g12>*{grid-column:1/-1 !important}}
</style>
</helmet>
<div class="ow-app {{theme}}" style="padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px;">

<header style="display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap;">
<div style="display: flex; align-items: center; gap: 16px;">
<span style="width: 56px; height: 56px; border-radius: 18px; background: var(--primary); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--hero-shadow);"><svg viewBox="0 0 24 24" class="ico" style="color: #FFFFFF; width: 30px; height: 30px;" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM8.5 12.5l2.5 2.5 4.5-5"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -1.4px;">Owezy Design System</h1>
<span style="font-size: 15px; font-weight: 500; color: var(--muted);">Shared by Owezy Mobile, Owezy Web and the Admin Console · v1.0 · Nov 2026</span>
</div>
</div>
<div style="margin-left: auto; display: flex; gap: 10px; align-items: center;">
<span class="badge brand">{{modeLabel}}</span>
<div class="seg" role="group" aria-label="Theme"><button type="button" class="{{lightCls}}" onClick="{{setLight}}">Light</button><button type="button" class="{{darkCls}}" onClick="{{setDark}}">Dark</button></div>
</div>
</header>

<section style="display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: baseline; gap: 12px;"><span class="mono" style="color: var(--primary-text); font-size: 13px; font-weight: 700;">01</span><h2 class="h2">Colour</h2><span class="cap" style="font-size: 13px;">Same token names in both themes · values shown for {{modeName}}</span></div>
<sc-for list="{{palette}}" as="grp" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 10px;">
<h3 class="h3">{{grp.label}}</h3>
<div class="gsw">
<sc-for list="{{grp.items}}" as="t" hint-placeholder-count="6">
<div class="sw"><div class="sw-chip" style="background: {{t.hex}}; border-bottom: 1px solid var(--border);"></div><div class="sw-meta"><span style="font-size: 13px; font-weight: 700;">{{t.name}}</span><span class="mono" style="color: var(--subtle);">{{t.hex}}</span></div></div>
</sc-for>
</div>
</div>
</sc-for>
<div class="card" style="padding: 16px 18px; display: flex; gap: 24px; flex-wrap: wrap; align-items: center;">
<span class="ov">Money rules</span>
<span style="font-size: 15px; font-weight: 800; color: var(--owed);">+$842.50 owed to you</span>
<span style="font-size: 15px; font-weight: 800; color: var(--owe);">−$215.00 you owe</span>
<span style="font-size: 15px; font-weight: 800;">$3,214.80 total spent</span>
<span class="cap">Never colour alone — every amount has a sign or a label.</span>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: baseline; gap: 12px;"><span class="mono" style="color: var(--primary-text); font-size: 13px; font-weight: 700;">02</span><h2 class="h2">Typography</h2><span class="cap" style="font-size: 13px;">Inter · tabular figures · JetBrains Mono for IDs</span></div>
<div class="card" style="display: flex; flex-direction: column;">
<sc-for list="{{type}}" as="s" hint-placeholder-count="11">
<div style="display: flex; align-items: center; gap: 24px; padding: 14px 20px; border-top: 1px solid var(--divider);">
<span style="width: 140px; flex: none; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 700;">{{s.name}}</span><span class="mono" style="color: var(--subtle);">{{s.spec}}</span></span>
<span style="font-size: {{s.size}}; font-weight: {{s.weight}}; letter-spacing: {{s.ls}}; text-transform: {{s.tt}}; font-family: {{s.ff}}; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{s.sample}}</span>
<span class="cap" style="margin-left: auto; flex: none;">{{s.use}}</span>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: baseline; gap: 12px;"><span class="mono" style="color: var(--primary-text); font-size: 13px; font-weight: 700;">03</span><h2 class="h2">Spacing, radius and elevation</h2></div>
<div class="g12">
<div class="card" style="grid-column: span 4; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<span class="ov">Spacing</span>
<sc-for list="{{spacing}}" as="s" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 12px;"><span class="mono" style="width: 64px; font-size: 12px; font-weight: 700;">{{s.name}}</span><span style="height: 12px; width: {{s.px}}; background: var(--primary); border-radius: 3px;"></span><span class="cap">{{s.px}}</span></div>
</sc-for>
</div>
<div class="card" style="grid-column: span 5; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<span class="ov">Radius</span>
<div style="display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;">
<sc-for list="{{radii}}" as="r" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 8px; align-items: center;"><span style="width: 64px; height: 64px; background: var(--primary-soft); border: 2px solid var(--primary); border-radius: {{r.v}}; box-sizing: border-box;"></span><span style="font-size: 12px; font-weight: 700;">{{r.name}}</span><span class="cap">{{r.v}}</span></div>
</sc-for>
</div>
</div>
<div class="card" style="grid-column: span 3; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<span class="ov">Elevation</span>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow);">Card · border + hairline</div>
<div style="background: var(--raised); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 700; box-shadow: 0 12px 32px -8px rgba(21,19,43,.18);">Popover · raised</div>
<div style="background: #635BDB; color: #FFFFFF; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 700; box-shadow: var(--hero-shadow);">Hero · violet glow</div>
</div>
<span class="cap">Dark mode uses surface steps instead of shadows.</span>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: baseline; gap: 12px;"><span class="mono" style="color: var(--primary-text); font-size: 13px; font-weight: 700;">04</span><h2 class="h2">Components</h2></div>
<div class="g12">

<div class="card" style="grid-column: span 6; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<span class="ov">Buttons</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
<button type="button" class="btn btn-p"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add user</button>
<button type="button" class="btn btn-s">Export</button>
<button type="button" class="btn">Filters</button>
<button type="button" class="btn btn-d">Suspend</button>
<button type="button" class="ibtn" aria-label="Notifications"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16zM10 21h4"></path></svg><span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--owe-fill); box-shadow: 0 0 0 2px var(--surface);"></span></button>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
<button type="button" class="btn btn-f">Focused</button>
<button type="button" class="btn btn-p btn-x" disabled="">Disabled</button>
<span class="cap">Primary · Secondary · Ghost · Danger · Icon — 40 px, radius 12</span>
</div>
</div>

<div class="card" style="grid-column: span 6; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<span class="ov">Status badges</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap;"><span class="badge ok">Active</span><span class="badge ok">Healthy</span><span class="badge warn">Pending</span><span class="badge warn">Degraded</span><span class="badge bad">Failed</span><span class="badge bad">Suspended</span><span class="badge info">In review</span><span class="badge info">Trial</span><span class="badge brand">Premium</span><span class="badge">Free</span><span class="badge">Archived</span></div>
<div style="display: flex; gap: 8px; align-items: center;"><span class="up">▲ 12.4%</span><span class="dn">▼ 3.1%</span><span class="cnt" style="margin-left: 0;">14</span><span class="cap">Delta pills and count badges</span></div>
</div>

<div class="card" style="grid-column: span 4; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<span class="ov">Inputs</span>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: var(--muted);">Default</span><input class="inp" type="text" placeholder="Name, email or user ID"></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: var(--muted);">Focused</span><input class="inp f" type="text" value="Lisbon Trip"></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: var(--muted);">Error</span><input class="inp e" type="text" value="4.1"><span style="font-size: 12px; font-weight: 600; color: var(--danger);">Use the format 4.10.0</span></label>
</div>

<div class="card" style="grid-column: span 4; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
<span class="ov">Selection</span>
<div class="seg" role="group" aria-label="Range" style="align-self: flex-start;"><sc-for list="{{ranges}}" as="r" hint-placeholder-count="4"><button type="button" class="{{r.cls}}" onClick="{{r.pick}}">{{r.label}}</button></sc-for></div>
<div class="tabs"><span class="on">Overview</span><span>Groups</span><span>Expenses</span><span>Devices</span></div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 12px;"><span style="font-size: 14px; font-weight: 600;">Receipt scanning</span><button type="button" class="{{sw1}}" role="switch" aria-checked="{{sw1on}}" aria-label="Receipt scanning" style="margin-left: auto;" onClick="{{toggle1}}"><span></span></button></div>
<div style="display: flex; align-items: center; gap: 12px;"><span style="font-size: 14px; font-weight: 600;">Auto-categorize</span><button type="button" class="{{sw2}}" role="switch" aria-checked="{{sw2on}}" aria-label="Auto-categorize" style="margin-left: auto;" onClick="{{toggle2}}"><span></span></button></div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600;"><input type="checkbox" checked="" style="width: 16px; height: 16px; accent-color: #635BDB; margin: 0;">Select row</label>
</div>
</div>

<div class="card" style="grid-column: span 4; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
<span class="ov">Sidebar navigation</span>
<span class="nav-a on"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"></path></svg>Dashboard</span>
<span class="nav-a"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM22 20v-1a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8"></path></svg>Users</span>
<span class="nav-a"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"></path></svg>Reports &amp; disputes<span class="cnt">14</span></span>
<span class="nav-a"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 3.5V8h4.5M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20.5V16h-4.5"></path></svg>Sync monitoring<span class="cnt">3</span></span>
<span class="cap">Active = soft violet fill, no edge bars</span>
</div>

<div class="card" style="grid-column: span 3; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;"><span style="width: 32px; height: 32px; border-radius: 10px; background: var(--primary-soft); color: var(--primary-text); display: inline-flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path></svg></span><span class="ov">Total users</span></div>
<div style="display: flex; align-items: flex-end; gap: 10px;"><span style="font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -0.8px;">48,213</span><svg viewBox="0 0 96 32" style="margin-left: auto; width: 80px; height: 28px;" aria-hidden="true"><path d="M2 28 C14 26 18 22 30 21 C42 20 46 16 58 14 C70 12 76 8 94 4" style="fill: none; stroke: var(--c1); stroke-width: 2; stroke-linecap: round;"></path></svg></div>
<div style="display: flex; align-items: center; gap: 8px;"><span class="up">▲ 12.4%</span><span class="cap">vs last 30 days</span></div>
</div>

<div style="grid-column: span 4; position: relative; overflow: hidden; background: #635BDB; color: #FFFFFF; border-radius: 22px; padding: 22px; box-shadow: var(--hero-shadow); display: flex; flex-direction: column; gap: 14px;">
<svg viewBox="0 0 400 400" style="position: absolute; right: -110px; top: -150px; width: 340px; height: 340px; pointer-events: none;" aria-hidden="true"><circle cx="200" cy="200" r="150" style="fill: none; stroke: #FFFFFF; stroke-opacity: .12; stroke-width: 28;"></circle><circle cx="200" cy="200" r="88" style="fill: none; stroke: #FFFFFF; stroke-opacity: .10; stroke-width: 18;"></circle></svg>
<span style="font-size: 13px; font-weight: 600; opacity: .88; position: relative;">Net balance</span>
<span style="font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -1.4px; position: relative;">+$842.50</span>
