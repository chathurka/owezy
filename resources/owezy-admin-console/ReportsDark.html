<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owezy Admin — Reports and disputes (dark)</title>
<link rel="icon" href="assets/icons/owezy-mark.svg" type="image/svg+xml">
<script src="assets/dc-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-template">

<helmet>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
body{margin:0}
.ow-app{--bg:#F6F5FB;--surface:#FFFFFF;--raised:#FFFFFF;--sunken:#F1F0F7;--border:#E9E7F2;--border-strong:#D9D6E6;--divider:#F0EEF6;--track:#EFEEF5;--text:#15132B;--muted:#5F5C78;--subtle:#6A6782;--primary:#635BDB;--primary-text:#4F47C7;--primary-soft:#EFEEFD;--owed:#087A4F;--owed-fill:#19A672;--owed-soft:#E5F5EE;--owe:#B34C15;--owe-fill:#EE7A30;--owe-soft:#FDEFE5;--danger:#C9303F;--danger-soft:#FCEAEC;--info:#2467C2;--info-soft:#E8F0FC;--inverse:#15132B;--on-inverse:#FFFFFF;--c1:#635BDB;--c2:#1FA595;--c3:#F2A53D;--c4:#E2668A;--c5:#4A8FE2;--cm:#DCD9EC;--grid:#EEECF5;--shadow:0 1px 2px rgba(21,19,43,.04);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums;min-height:100vh;-webkit-font-smoothing:antialiased}
.ow-app.dark{--bg:#0D0C16;--surface:#16142A;--raised:#1F1C36;--sunken:#110F20;--border:#2A2744;--border-strong:#3A365A;--divider:#221F3A;--track:#1B1932;--text:#F2F1FA;--muted:#A9A6C4;--subtle:#8F8CAB;--primary:#6A62E6;--primary-text:#ABA5FA;--primary-soft:#26224A;--owed:#43CF93;--owed-fill:#43CF93;--owed-soft:#12332A;--owe:#F59A5B;--owe-fill:#F59A5B;--owe-soft:#3A2416;--danger:#F27583;--danger-soft:#3C1A22;--info:#6EA8F2;--info-soft:#172A45;--inverse:#F2F1FA;--on-inverse:#15132B;--c1:#8A83F4;--c2:#3FCDB9;--c3:#F5B65E;--c4:#F08AA8;--c5:#74AEF5;--cm:#34304F;--grid:#26233F;--shadow:none}
.ow-app a{color:var(--primary-text)}
.ow-app a:hover{color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ov{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--subtle)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted) !important;text-decoration:none}
.nav-a:hover{background:var(--track);color:var(--text) !important}
.nav-a.on{background:var(--primary-soft);color:var(--primary-text) !important;font-weight:700}
.cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:1px 7px}
.btn{font:inherit;font-size:13px;font-weight:700;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--primary);border-color:var(--primary);color:#FFFFFF !important;box-shadow:0 6px 16px -6px rgba(99,91,219,.6)}
.btn-d{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.seg{display:inline-flex;background:var(--track);padding:4px;border-radius:12px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:12px;font-weight:700;height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--raised);color:var(--primary-text);box-shadow:0 1px 3px rgba(21,19,43,.12)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--track);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--owed-soft);color:var(--owed)}.warn{background:var(--owe-soft);color:var(--owe)}.bad{background:var(--danger-soft);color:var(--danger)}.info{background:var(--info-soft);color:var(--info)}.brand{background:var(--primary-soft);color:var(--primary-text)}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--divider);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
.row:hover{background:var(--sunken)}
.row.on{background:var(--primary-soft)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
@media (max-width: 1080px){.g12>*{grid-column:1/-1 !important}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width: 640px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</helmet>
<div class="ow-app {{theme}}" style="display: flex; flex-wrap: wrap; align-items: stretch;">
<aside style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 20px;">
<a href="{{homeHref}}" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none;">
<span style="width: 34px; height: 34px; border-radius: 11px; background: var(--primary); display: inline-flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" class="ico" style="color: #FFFFFF; width: 20px; height: 20px;" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM8.5 12.5l2.5 2.5 4.5-5"></path></svg></span>
<span style="font-size: 19px; font-weight: 800; letter-spacing: -0.5px; color: var(--text);">Owezy</span>
<span class="badge brand" style="margin-left: auto;">Admin</span>
</a>
<nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 16px;">
<sc-for list="{{nav}}" as="grp" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span class="ov" style="padding: 0 12px 6px; color: var(--subtle);">{{grp.label}}</span>
<sc-for list="{{grp.items}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" class="{{it.cls}}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{it.icon}}"></path></svg>{{it.label}}<sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}"><span class="cnt">{{it.count}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; background: var(--sunken); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--owed-fill);"></span>All systems normal</span>
<span class="cap">API p95 182 ms · v4.12.0</span>
</div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<header style="height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;">
<label style="flex: 1 1 260px; max-width: 420px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--bg); color: var(--subtle);"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.search}}"></path></svg><span class="sr">Search</span><input type="search" placeholder="Search users, groups, IDs…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text);"><kbd style="font: inherit; font-size: 11px; font-weight: 700; color: var(--subtle); border: 1px solid var(--border-strong); border-radius: 6px; padding: 1px 6px;">⌘K</kbd></label>
<span class="badge ok" style="margin-left: auto;">Production</span>
<button type="button" class="ibtn" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{themeIcon}}"></path></svg></button>
<button type="button" class="ibtn" aria-label="Notifications, 5 unread"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--owe-fill); box-shadow: 0 0 0 2px var(--surface);"></span></button>
<span style="display: flex; align-items: center; gap: 10px; padding-left: 6px;"><span style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">RF</span><span style="display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 700;">Ravi Fernando</span><span class="cap">Super admin</span></span></span>
</header>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1440px; width: 100%; box-sizing: border-box;">

<div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.6px;">Reports &amp; disputes</h1>
<span class="cap">Moderation queue · SLA 24 h</span>
</div>
<div style="margin-left: auto; display: flex; gap: 10px;">
<button type="button" class="btn">Assigned to me · 5</button>
<button type="button" class="btn"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.download}}"></path></svg>Export</button>
</div>
</div>

<div class="g5">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;"><span class="ov">{{s.label}}</span><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.6px; color: {{s.color}};">{{s.value}}</span><span class="cap">{{s.note}}</span></div>
</sc-for>
</div>

<div class="g12">
<section class="card" style="grid-column: span 7; display: flex; flex-direction: column; overflow: hidden;">
<div style="padding: 14px 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
<div class="seg" role="group" aria-label="Queue"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div>
<button type="button" class="btn" style="margin-left: auto; height: 36px;">Type: All<svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" class="btn" style="height: 36px;">Priority<svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<sc-for list="{{cases}}" as="c" hint-placeholder-count="8">
<button type="button" class="{{c.cls}}" onClick="{{c.pick}}">
<span style="width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: {{c.bg}}; color: {{c.fg}}; flex: none;"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{c.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1;">
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;"><span style="font-size: 14px; font-weight: 700;">{{c.title}}</span><span class="mono" style="color: var(--subtle);">{{c.id}}</span></span>
<span class="cap">{{c.type}} · {{c.subject}} · by {{c.reporter}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none;">
<span class="{{c.statusCls}}">{{c.status}}</span>
<span class="prio" style="color: {{c.pColor}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor;"></span>{{c.prio}} · {{c.age}}</span>
</span>
</button>
</sc-for>
</section>

<section class="card" style="grid-column: span 5; padding: 22px; display: flex; flex-direction: column; gap: 18px; align-self: start;">
<div style="display: flex; align-items: flex-start; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span class="mono" style="color: var(--subtle);">{{sel.id}} · opened {{sel.age}} ago</span>
<h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.4px;">{{sel.title}}</h2>
<span style="display: flex; gap: 8px; flex-wrap: wrap;"><span class="{{sel.statusCls}}">{{sel.status}}</span><span class="badge">{{sel.type}}</span></span>
</div>
<span style="margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 22px; font-weight: 800;">{{sel.amount}}</span><span class="cap">in dispute</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<div style="background: var(--sunken); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span class="ov">Reporter</span><span style="font-size: 14px; font-weight: 700;">{{sel.reporter}}</span></div>
<div style="background: var(--sunken); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span class="ov">Reported</span><span style="font-size: 14px; font-weight: 700;">{{sel.against}}</span></div>
<div style="background: var(--sunken); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span class="ov">Group</span><span style="font-size: 14px; font-weight: 700;">{{sel.subject}}</span></div>
<div style="background: var(--sunken); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span class="ov">Assignee</span><span style="font-size: 14px; font-weight: 700;">Ravi Fernando</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px;">
<span class="ov">Timeline</span>
<sc-for list="{{sel.timeline}}" as="t" hint-placeholder-count="4">
<div style="display: flex; gap: 12px;">
<span style="width: 28px; height: 28px; border-radius: 50%; background: {{t.bg}}; color: {{t.fg}}; display: inline-flex; align-items: center; justify-content: center; flex: none; font-size: 10px; font-weight: 800;">{{t.ini}}</span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 600; white-space: normal;">{{t.text}}</span><span class="cap">{{t.when}}</span></span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 10px;">
<span style="flex: 1; height: 64px; border-radius: 12px; background: var(--track); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 700;"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"></path></svg>bank-receipt.pdf</span>
<span style="flex: 1; height: 64px; border-radius: 12px; background: var(--track); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 700;"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4M15 9h.01"></path></svg>screenshot.png</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px;"><span class="ov">Internal note</span><textarea rows="3" placeholder="Visible to admins only" style="font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: 12px; padding: 10px 12px; resize: vertical;"></textarea></label>
<div style="display: flex; gap: 10px; flex-wrap: wrap;">
<button type="button" class="btn">Request info</button>
<button type="button" class="btn btn-d">Reject</button>
<button type="button" class="btn btn-p" style="margin-left: auto;"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Resolve</button>
</div>
</section>
</div>

</div>
</main>
</div>

</script>

const NAV = [

  ['RPT-2033', 'Group invite spam', 'Spam invites', '—', 'Kenji Watanabe', 'usr_7Z2K11', '—', 'Low', '2 d', 'In review'],
  ['RPT-2031', 'Paid twice by mistake', 'Payment dispute', 'Office Lunch', 'Jordan Lee', 'Alex Morgan', '$70.00', 'Medium', '3 d', 'Open'],
  ['RPT-2026', 'Refund for cancelled booking', 'Payment dispute', 'Bali Retreat 2026', 'Priya Nair', 'Aisha Bello', '$420.00', 'Medium', '4 d', 'Resolved']
];
const TL = {
  'RPT-2041': [
    ['SI', 'Sana reported: “Alex marked $145.00 as paid but nothing arrived.”', 'Nov 7 · 09:12', 'var(--owe-soft)', 'var(--owe)'],
