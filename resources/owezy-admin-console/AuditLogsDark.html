<helmet>

<style>
body{margin:0}
.ow-app{--bg:#F6F5FB;--surface:#FFFFFF;--raised:#FFFFFF;--sunken:#F1F0F7;--border:#E9E7F2;--border-strong:#D9D6E6;--divider:#F0EEF6;--track:#EFEEF5;--text:#15132B;--muted:#5F5C78;--subtle:#6A6782;--primary:#635BDB;--primary-text:#4F47C7;--primary-soft:#EFEEFD;--owed:#087A4F;--owed-fill:#19A672;--owed-soft:#E5F5EE;--owe:#B34C15;--owe-fill:#EE7A30;--owe-soft:#FDEFE5;--danger:#C9303F;--danger-soft:#FCEAEC;--info:#2467C2;--info-soft:#E8F0FC;--inverse:#15132B;--on-inverse:#FFFFFF;--shadow:0 1px 2px rgba(21,19,43,.04);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums;min-height:100vh;-webkit-font-smoothing:antialiased}
.ow-app.dark{--bg:#0D0C16;--surface:#16142A;--raised:#1F1C36;--sunken:#110F20;--border:#2A2744;--border-strong:#3A365A;--divider:#221F3A;--track:#1B1932;--text:#F2F1FA;--muted:#A9A6C4;--subtle:#8F8CAB;--primary:#6A62E6;--primary-text:#ABA5FA;--primary-soft:#26224A;--owed:#43CF93;--owed-fill:#43CF93;--owed-soft:#12332A;--owe:#F59A5B;--owe-fill:#F59A5B;--owe-soft:#3A2416;--danger:#F27583;--danger-soft:#3C1A22;--info:#6EA8F2;--info-soft:#172A45;--inverse:#F2F1FA;--on-inverse:#15132B;--shadow:none}
.ow-app a{color:var(--primary-text)}
.ow-app a:hover{color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ov{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--subtle)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted) !important;text-decoration:none}
.nav-a:hover{background:var(--track);color:var(--text) !important}
.nav-a.on{background:var(--primary-soft);color:var(--primary-text) !important;font-weight:700}
.cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:1px 7px}
.btn{font:inherit;font-size:13px;font-weight:700;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.gbtn{width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gbtn:hover{background:var(--track)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--track);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--owed-soft);color:var(--owed)}.warn{background:var(--owe-soft);color:var(--owe)}.bad{background:var(--danger-soft);color:var(--danger)}.info{background:var(--info-soft);color:var(--info)}.brand{background:var(--primary-soft);color:var(--primary-text)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--sunken);text-align:left;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 16px;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--divider);white-space:nowrap;vertical-align:middle}
.tbl tr.open td{background:var(--primary-soft)}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#FFFFFF;flex:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:500}
.pg{min-width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;cursor:pointer}
.pg.on{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width: 900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

</helmet>
<div class="ow-app {{theme}}" style="display: flex; flex-wrap: wrap; align-items: stretch;">

<span class="cap">API p95 182 ms · v4.12.0</span>

<div style="padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1440px; width: 100%; box-sizing: border-box;">

<div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.6px;">Audit logs</h1>

</sc-for>
</div>

<section class="card" style="display: flex; flex-direction: column; overflow: hidden;">
<div style="padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border);">
<label style="flex: 1 1 240px; max-width: 320px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 12px; color: var(--subtle);"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.search}}"></path></svg><span class="sr">Search logs</span><input type="search" placeholder="Actor, action or resource ID" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text);"></label>

<div style="overflow-x: auto;">
<table class="tbl">
<thead><tr><th><span class="sr">Expand</span></th><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>IP · location</th><th>Result</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<tr class="{{r.rowCls}}">
<td style="width: 32px; padding-right: 0;"><button type="button" class="gbtn" aria-expanded="{{r.exp}}" aria-label="Show details" onClick="{{r.toggle}}"><svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px; transform: {{r.rot}};" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></td>
<td><span style="display: flex; flex-direction: column;"><span class="mono" style="font-weight: 700;">{{r.time}}</span><span class="cap">{{r.date}}</span></span></td>
<td><span style="display: flex; align-items: center; gap: 10px;"><span class="av" style="background: {{r.color}};">{{r.ini}}</span><span style="display: flex; flex-direction: column;"><span style="font-weight: 700;">{{r.actor}}</span><span class="cap">{{r.role}}</span></span></span></td>
<td><span style="display: flex; align-items: center; gap: 8px;"><span class="{{r.catCls}}">{{r.cat}}</span><span style="font-weight: 600;">{{r.action}}</span></span></td>
<td><span style="display: flex; flex-direction: column;"><span class="mono" style="color: var(--primary-text); font-weight: 700;">{{r.res}}</span><span class="cap">{{r.resLabel}}</span></span></td>
<td><span style="display: flex; flex-direction: column;"><span class="mono" style="color: var(--muted);">{{r.ip}}</span><span class="cap">{{r.loc}}</span></span></td>
<td><span class="{{r.resultCls}}">{{r.result}}</span></td>
</tr>
<sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
<tr><td colspan="7" style="padding: 0 16px 16px 64px; background: var(--primary-soft); border-top: 0;">
<div style="display: flex; gap: 16px; flex-wrap: wrap;">
<div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;"><span class="ov">Change</span><pre class="mono" style="margin: 0; white-space: pre-wrap; line-height: 20px;"><span style="color: var(--danger);">- status: "active"</span>
<span style="color: var(--owed);">+ status: "suspended"</span>
<span style="color: var(--owed);">+ reason: "fraud_review"</span>
<span style="color: var(--owed);">+ linked_report: "RPT-2038"</span></pre></div>
<div style="flex: 1 1 220px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px;"><span class="ov">Context</span><span><span style="color: var(--muted); font-weight: 600;">Request ID</span> <span class="mono">req_7c1e93ab42</span></span><span><span style="color: var(--muted); font-weight: 600;">Session</span> <span class="mono">ses_51f0d2</span> · MFA verified</span><span><span style="color: var(--muted); font-weight: 600;">Client</span> Admin console · Chrome 131</span></div>
</div>
</td></tr>
</sc-if>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--border); flex-wrap: wrap;">
<span class="cap" style="font-size: 13px;">Showing 1–10 of 2,418</span>
<span style="margin-left: auto; display: flex; gap: 6px; align-items: center;">
<button type="button" class="pg" aria-label="Previous page"><svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" class="pg on">1</button><button type="button" class="pg">2</button><button type="button" class="pg">3</button><span class="cap">…</span><button type="button" class="pg">242</button>
<button type="button" class="pg" aria-label="Next page"><svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</span>
</div>
</section>

</div>
</main>
</div>

</script>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1200}}'>
