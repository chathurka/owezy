<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-template">

<helmet>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
body{margin:0}
.ow-app{--bg:#F6F5FB;--surface:#FFFFFF;--raised:#FFFFFF;--sunken:#F1F0F7;--border:#E9E7F2;--border-strong:#D9D6E6;--divider:#F0EEF6;--track:#EFEEF5;--text:#15132B;--muted:#5F5C78;--subtle:#6A6782;--primary:#635BDB;--primary-text:#4F47C7;--primary-soft:#EFEEFD;--owed:#087A4F;--owed-fill:#19A672;--owed-soft:#E5F5EE;--owe:#B34C15;--owe-fill:#EE7A30;--owe-soft:#FDEFE5;--danger:#C9303F;--danger-soft:#FCEAEC;--info:#2467C2;--info-soft:#E8F0FC;--inverse:#15132B;--on-inverse:#FFFFFF;--c1:#635BDB;--c2:#1FA595;--c3:#F2A53D;--c4:#E2668A;--c5:#4A8FE2;--cm:#DCD9EC;--grid:#EEECF5;--shadow:0 1px 2px rgba(21,19,43,.04);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums;min-height:100vh;-webkit-font-smoothing:antialiased}
.ow-app.dark{--bg:#0D0C16;--surface:#16142A;--raised:#1F1C36;--sunken:#110F20;--border:#2A2744;--border-strong:#3A365A;--divider:#221F3A;--track:#1B1932;--text:#F2F1FA;--muted:#A9A6C4;--subtle:#8F8CAB;--primary:#6A62E6;--primary-text:#ABA5FA;--primary-soft:#26224A;--owed:#43CF93;--owed-fill:#43CF93;--owed-soft:#12332A;--owe:#F59A5B;--owe-fill:#F59A5B;--owe-soft:#3A2416;--danger:#F27583;--danger-soft:#3C1A22;--info:#6EA8F2;--info-soft:#172A45;--inverse:#F2F1FA;--on-inverse:#15132B;--c1:#8A83F4;--c2:#3FCDB9;--c3:#F5B65E;--c4:#F08AA8;--c5:#74AEF5;--cm:#34304F;--grid:#26233F;--shadow:none}
.ow-app a{color:var(--primary-text)}
.ow-app a:hover{color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ov{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--subtle)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted) !important;text-decoration:none}
.nav-a:hover{background:var(--track);color:var(--text) !important}
.nav-a.on{background:var(--primary-soft);color:var(--primary-text) !important;font-weight:700}
.cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:1px 7px}
.btn{font:inherit;font-size:13px;font-weight:700;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--primary);border-color:var(--primary);color:#FFFFFF !important;box-shadow:0 6px 16px -6px rgba(99,91,219,.6)}
.btn-s{background:var(--primary-soft);border-color:transparent;color:var(--primary-text)}
.btn-d{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.gbtn{width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gbtn:hover{background:var(--track)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--track);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--owed-soft);color:var(--owed)}.warn{background:var(--owe-soft);color:var(--owe)}.bad{background:var(--danger-soft);color:var(--danger)}.info{background:var(--info-soft);color:var(--info)}.brand{background:var(--primary-soft);color:var(--primary-text)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--sunken);text-align:left;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 16px;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--divider);white-space:nowrap;vertical-align:middle}
.tbl tr:hover td{background:var(--sunken)}
.tbl .num{text-align:right}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#FFFFFF;flex:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:500}

.pg.on{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
.chk{width:16px;height:16px;accent-color:#635BDB;margin:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}

<a href="{{homeHref}}" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none;">
<span style="width: 34px; height: 34px; border-radius: 11px; background: var(--primary); display: inline-flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" class="ico" style="color: #FFFFFF; width: 20px; height: 20px;" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM8.5 12.5l2.5 2.5 4.5-5"></path></svg></span>
<span style="font-size: 19px; font-weight: 800; letter-spacing: -0.5px; color: var(--text);">Owezy</span>
<span class="badge brand" style="margin-left: auto;">Admin</span>
</a>

<span class="ov" style="padding: 0 12px 6px; color: var(--subtle);">{{grp.label}}</span>
<sc-for list="{{grp.items}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" class="{{it.cls}}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{it.icon}}"></path></svg>{{it.label}}<sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}"><span class="cnt">{{it.count}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; background: var(--sunken); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--owed-fill);"></span>All systems normal</span>
<span class="cap">API p95 182 ms · v4.12.0</span>
</div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">

<span class="badge ok" style="margin-left: auto;">Production</span>
<button type="button" class="ibtn" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{themeIcon}}"></path></svg></button>
<button type="button" class="ibtn" aria-label="Notifications, 5 unread"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--owe-fill); box-shadow: 0 0 0 2px var(--surface);"></span></button>
<span style="display: flex; align-items: center; gap: 10px; padding-left: 6px;"><span style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">RF</span><span style="display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 700;">Ravi Fernando</span><span class="cap">Super admin</span></span></span>
</header>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1440px; width: 100%; box-sizing: border-box;">

<div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.6px;">Users</h1>
<span class="cap">48,213 registered · 31,806 active in the last 30 days</span>
</div>
<div style="margin-left: auto; display: flex; gap: 10px;">
<button type="button" class="btn"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.download}}"></path></svg>Export CSV</button>
<button type="button" class="btn btn-p"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add user</button>
</div>
</div>

<div class="g4">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div class="card" style="padding: 16px 18px; display: flex; align-items: center; gap: 14px;">
<span style="width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: {{s.bg}}; color: {{s.fg}};"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px;"><span class="cap" style="font-weight: 600;">{{s.label}}</span><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.4px;">{{s.value}}</span></div>
</div>
</sc-for>
</div>

<section class="card" style="display: flex; flex-direction: column;">
<div style="padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border);">
<label style="flex: 1 1 240px; max-width: 320px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 12px; color: var(--subtle);"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.search}}"></path></svg><span class="sr">Search users</span><input type="search" placeholder="Name, email or user ID" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text);"></label>
<button type="button" class="btn">Status: All<svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" class="btn">Plan: All<svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" class="btn">Country: All<svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" class="btn">Joined: Any time<svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" class="btn" style="border-color: transparent; color: var(--primary-text);">Clear</button>
</div>
<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--primary-soft); flex-wrap: wrap;">
<span style="font-size: 13px; font-weight: 700; color: var(--primary-text);">{{selCount}} selected</span>
<button type="button" class="btn" style="height: 32px; margin-left: auto;">Send email</button>
<button type="button" class="btn" style="height: 32px;">Export</button>
<button type="button" class="btn btn-d" style="height: 32px;">Suspend</button>
</div>
</sc-if>
<div style="overflow-x: auto;">
<table class="tbl">
<thead><tr>
<th style="width: 16px;"><input type="checkbox" class="chk" aria-label="Select all"></th>
<th>User</th><th>User ID</th><th>Plan</th><th class="num">Groups</th><th class="num">Net balance</th><th>Status</th><th>Last active</th><th>Joined</th><th><span class="sr">Actions</span></th>
</tr></thead>
<tbody>
<sc-for list="{{rows}}" as="u" hint-placeholder-count="10">
<tr>
<td><input type="checkbox" class="chk" checked="{{u.sel}}" onChange="{{u.toggle}}" aria-label="Select {{u.name}}"></td>
<td><a href="{{detailHref}}" style="display: flex; align-items: center; gap: 12px; text-decoration: none;"><span class="av" style="background: {{u.color}};">{{u.ini}}</span><span style="display: flex; flex-direction: column;"><span style="font-weight: 700; color: var(--text);">{{u.name}}</span><span class="cap">{{u.email}}</span></span></a></td>
<td><span class="mono" style="color: var(--muted);">{{u.id}}</span></td>
<td><span class="{{u.planCls}}">{{u.plan}}</span></td>
<td class="num" style="font-weight: 600;">{{u.groups}}</td>
<td class="num" style="font-weight: 800; color: {{u.balColor}};">{{u.bal}}</td>
<td><span class="{{u.statusCls}}">{{u.status}}</span></td>
<td style="color: var(--muted); font-size: 13px;">{{u.last}}</td>
<td style="color: var(--muted); font-size: 13px;">{{u.joined}}</td>
<td style="text-align: right;"><button type="button" class="gbtn" aria-label="More actions for {{u.name}}"><svg viewBox="0 0 24 24" class="ico" style="stroke-width: 3;" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--border); flex-wrap: wrap;">
<span class="cap" style="font-size: 13px;">Showing 1–10 of 48,213</span>
<span style="margin-left: auto; display: flex; gap: 6px; align-items: center;">
<button type="button" class="pg" aria-label="Previous page"><svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" class="pg on">1</button><button type="button" class="pg">2</button><button type="button" class="pg">3</button><span class="cap">…</span><button type="button" class="pg">4,822</button>
<button type="button" class="pg" aria-label="Next page"><svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</span>
</div>
</section>

</div>
</main>
</div>

</script>

    const rows = USERS.map((u, i) => ({
      name: u[0], ini: u[1], email: u[2], id: u[3], plan: u[4], planCls: PLAN[u[4]], groups: u[5], bal: money(u[6]),
      balColor: u[6] > 0 ? 'var(--owed)' : (u[6] < 0 ? 'var(--owe)' : 'var(--muted)'),
      status: u[7], statusCls: STATUS[u[7]], last: u[8], joined: u[9], color: u[10], sel: !!sel[i],
      toggle: () => { const n = Object.assign({}, this.state.sel); n[i] = !n[i]; this.setState({ sel: n }); }
    }));
    const selCount = rows.filter((r) => r.sel).length;
    return {
      theme: dark ? 'dark' : '', themeIcon: dark ? IC.sun : IC.moon, themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.setState({ dark: !dark }), ic: IC, nav: nav, homeHref: 'Main' + sfx + '.html', detailHref: 'UserDetails' + sfx + '.html',
      stats: [
        { label: 'Total users', value: '48,213', icon: IC.users, bg: 'var(--primary-soft)', fg: 'var(--primary-text)' },
        { label: 'Active · 30 days', value: '31,806', icon: IC.pulse, bg: 'var(--owed-soft)', fg: 'var(--owed)' },
        { label: 'Premium', value: '6,942', icon: IC.crown, bg: 'var(--info-soft)', fg: 'var(--info)' },
        { label: 'Suspended', value: '128', icon: IC.ban, bg: 'var(--danger-soft)', fg: 'var(--danger)' }
      ],
      rows: rows, selCount: selCount, hasSel: selCount > 0
    };
  }
}
</script>
<script>DC.mount({});</script>
</body>
