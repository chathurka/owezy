.ow-app a{color:var(--primary-text)}
.ow-app a:hover{color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ov{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--subtle)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted) !important;text-decoration:none}
.nav-a:hover{background:var(--track);color:var(--text) !important}
.nav-a.on{background:var(--primary-soft);color:var(--primary-text) !important;font-weight:700}
.cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:1px 7px}
.btn{font:inherit;font-size:13px;font-weight:700;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--primary);border-color:var(--primary);color:#FFFFFF !important;box-shadow:0 6px 16px -6px rgba(99,91,219,.6)}
.btn-d{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--track);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--owed-soft);color:var(--owed)}.warn{background:var(--owe-soft);color:var(--owe)}.bad{background:var(--danger-soft);color:var(--danger)}.info{background:var(--info-soft);color:var(--info)}.brand{background:var(--primary-soft);color:var(--primary-text)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--sunken);text-align:left;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 16px;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--divider);white-space:nowrap;vertical-align:middle}
.tbl .num{text-align:right}
.tile{width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border-strong);overflow-x:auto}
.tabs button{font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:0;padding:0 0 12px;border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--primary-text);font-weight:700;border-bottom-color:var(--primary)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:10px 0;border-top:1px solid var(--divider)}
.kv span:first-child{color:var(--muted);font-weight:600}
.kv span:last-child{font-weight:700;text-align:right}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}

@media (max-width: 720px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
