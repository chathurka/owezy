<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owezy Admin — Dashboard (dark)</title>
<link rel="icon" href="assets/icons/owezy-mark.svg" type="image/svg+xml">
<script src="assets/dc-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-template">

<helmet>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
body{margin:0}
.ow-app{--bg:#F6F5FB;--surface:#FFFFFF;--raised:#FFFFFF;--sunken:#F1F0F7;--border:#E9E7F2;--border-strong:#D9D6E6;--divider:#F0EEF6;--track:#EFEEF5;--text:#15132B;--muted:#5F5C78;--subtle:#6A6782;--primary:#635BDB;--primary-hover:#554DCB;--primary-text:#4F47C7;--primary-soft:#EFEEFD;--owed:#087A4F;--owed-fill:#19A672;--owed-soft:#E5F5EE;--owe:#B34C15;--owe-fill:#EE7A30;--owe-soft:#FDEFE5;--danger:#C9303F;--danger-soft:#FCEAEC;--info:#2467C2;--info-soft:#E8F0FC;--inverse:#15132B;--on-inverse:#FFFFFF;--c1:#635BDB;--c2:#1FA595;--c3:#F2A53D;--c4:#E2668A;--c5:#4A8FE2;--cm:#DCD9EC;--grid:#EEECF5;--shadow:0 1px 2px rgba(21,19,43,.04);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums;min-height:100vh;-webkit-font-smoothing:antialiased}
.ow-app.dark{--bg:#0D0C16;--surface:#16142A;--raised:#1F1C36;--sunken:#110F20;--border:#2A2744;--border-strong:#3A365A;--divider:#221F3A;--track:#1B1932;--text:#F2F1FA;--muted:#A9A6C4;--subtle:#8F8CAB;--primary:#6A62E6;--primary-hover:#7A72F0;--primary-text:#ABA5FA;--primary-soft:#26224A;--owed:#43CF93;--owed-fill:#43CF93;--owed-soft:#12332A;--owe:#F59A5B;--owe-fill:#F59A5B;--owe-soft:#3A2416;--danger:#F27583;--danger-soft:#3C1A22;--info:#6EA8F2;--info-soft:#172A45;--inverse:#F2F1FA;--on-inverse:#15132B;--c1:#8A83F4;--c2:#3FCDB9;--c3:#F5B65E;--c4:#F08AA8;--c5:#74AEF5;--cm:#34304F;--grid:#26233F;--shadow:none}
.ow-app a{color:var(--primary-text)}
.ow-app a:hover{color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ov{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--subtle)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted) !important;text-decoration:none}
.nav-a:hover{background:var(--track);color:var(--text) !important}
.nav-a.on{background:var(--primary-soft);color:var(--primary-text) !important;font-weight:700}
.cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:1px 7px}
.btn{font:inherit;font-size:13px;font-weight:700;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--primary);border-color:var(--primary);color:#FFFFFF !important;box-shadow:0 6px 16px -6px rgba(99,91,219,.6)}
.btn-s{background:var(--primary-soft);border-color:transparent;color:var(--primary-text)}
.btn-d{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.seg{display:inline-flex;background:var(--track);padding:4px;border-radius:12px;gap:2px}
.seg button{font:inherit;font-size:12px;font-weight:700;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--raised);color:var(--primary-text);box-shadow:0 1px 3px rgba(21,19,43,.12)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--track);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--owed-soft);color:var(--owed)}.warn{background:var(--owe-soft);color:var(--owe)}.bad{background:var(--danger-soft);color:var(--danger)}.info{background:var(--info-soft);color:var(--info)}.brand{background:var(--primary-soft);color:var(--primary-text)}
.up{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--owed-soft);color:var(--owed)}
.dn{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--danger-soft);color:var(--danger)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width: 1080px){.g12>*{grid-column:span 6 !important}}
@media (max-width: 720px){.g12>*{grid-column:1/-1 !important}}
</style>
</helmet>
<div class="ow-app {{theme}}" style="display: flex; flex-wrap: wrap; align-items: stretch;">
<aside style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 20px;">
<a href="{{homeHref}}" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none;">
<span style="width: 34px; height: 34px; border-radius: 11px; background: var(--primary); display: inline-flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" class="ico" style="color: #FFFFFF; width: 20px; height: 20px;" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM8.5 12.5l2.5 2.5 4.5-5"></path></svg></span>
<span style="font-size: 19px; font-weight: 800; letter-spacing: -0.5px; color: var(--text);">Owezy</span>
<span class="badge brand" style="margin-left: auto;">Admin</span>
</a>
<nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 16px;">
<sc-for list="{{nav}}" as="grp" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span class="ov" style="padding: 0 12px 6px; color: var(--subtle);">{{grp.label}}</span>
<sc-for list="{{grp.items}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" class="{{it.cls}}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{it.icon}}"></path></svg>{{it.label}}<sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}"><span class="cnt">{{it.count}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; background: var(--sunken); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--owed-fill);"></span>All systems normal</span>
<span class="cap">API p95 182 ms · v4.12.0</span>
</div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<header style="height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;">
<label style="flex: 1 1 260px; max-width: 420px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--bg); color: var(--subtle);"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.search}}"></path></svg><span class="sr">Search</span><input type="search" placeholder="Search users, groups, IDs…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text);"><kbd style="font: inherit; font-size: 11px; font-weight: 700; color: var(--subtle); border: 1px solid var(--border-strong); border-radius: 6px; padding: 1px 6px;">⌘K</kbd></label>
<span class="badge ok" style="margin-left: auto;">Production</span>
<button type="button" class="ibtn" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{themeIcon}}"></path></svg></button>
<button type="button" class="ibtn" aria-label="Notifications, 5 unread"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--owe-fill); box-shadow: 0 0 0 2px var(--surface);"></span></button>
<span style="display: flex; align-items: center; gap: 10px; padding-left: 6px;"><span style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">RF</span><span style="display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 700;">Ravi Fernando</span><span class="cap">Super admin</span></span></span>
</header>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1440px; width: 100%; box-sizing: border-box;">

<div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.6px;">Dashboard</h1>
<span class="cap">Platform overview · Updated 2 min ago</span>
</div>
<div style="margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap;">
<div class="seg" role="group" aria-label="Range"><sc-for list="{{ranges}}" as="r" hint-placeholder-count="4"><button type="button" class="{{r.cls}}" onClick="{{r.pick}}">{{r.label}}</button></sc-for></div>
<button type="button" class="btn"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.download}}"></path></svg>Export</button>
</div>
</div>

<div class="g12">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div class="card" style="grid-column: span 3; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;"><span style="width: 32px; height: 32px; border-radius: 10px; background: var(--primary-soft); color: var(--primary-text); display: inline-flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{k.icon}}"></path></svg></span><span class="ov">{{k.label}}</span></div>
<div style="display: flex; align-items: flex-end; gap: 12px;">
<span style="font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -0.8px;">{{k.value}}</span>
<svg viewBox="0 0 96 32" style="margin-left: auto; width: 96px; height: 32px;" aria-hidden="true"><path d="{{k.spark}}" style="fill: none; stroke: var(--c1); stroke-width: 2; stroke-linecap: round;"></path></svg>
</div>
<div style="display: flex; align-items: center; gap: 8px;"><span class="up">▲ {{k.delta}}</span><span class="cap">vs last 30 days</span></div>
</div>
</sc-for>
</div>

<div class="g12">
<section class="card" style="grid-column: span 8; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0; font-size: 17px; font-weight: 700;">User growth</h2><span class="cap">Total registered users · last 12 months</span></div>
<div style="margin-left: auto; display: flex; gap: 16px; align-items: center;"><span style="display: flex; align-items: center; gap: 6px;" class="cap"><span class="dot" style="background: var(--c1);"></span>Total users</span><span style="display: flex; align-items: center; gap: 6px;" class="cap"><span class="dot" style="background: var(--c2);"></span>Monthly active</span></div>
</div>
<svg viewBox="0 0 720 240" style="width: 100%; height: auto; display: block;" role="img" aria-label="User growth from 24,600 to 47,612 total users over 12 months; monthly active users from 15,900 to 31,800">
<sc-for list="{{ug.grid}}" as="gl" hint-placeholder-count="4"><line x1="44" x2="712" y1="{{gl.y}}" y2="{{gl.y}}" style="stroke: var(--grid); stroke-width: 1;"></line><text x="36" y="{{gl.ty}}" text-anchor="end" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">{{gl.label}}</text></sc-for>
<path d="{{ug.area}}" style="fill: var(--c1); opacity: 0.12;"></path>
<path d="{{ug.line2}}" style="fill: none; stroke: var(--c2); stroke-width: 2.5; stroke-linecap: round;"></path>
<path d="{{ug.line}}" style="fill: none; stroke: var(--c1); stroke-width: 3; stroke-linecap: round;"></path>
<sc-for list="{{ug.xl}}" as="xl" hint-placeholder-count="12"><text x="{{xl.x}}" y="232" text-anchor="middle" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">{{xl.label}}</text></sc-for>
<circle cx="{{ug.lx}}" cy="{{ug.ly}}" r="6" style="fill: var(--surface); stroke: var(--c1); stroke-width: 3;"></circle>
<rect x="{{ug.tx}}" y="{{ug.tty}}" width="104" height="40" rx="8" style="fill: var(--inverse);"></rect>
<text x="{{ug.ttx}}" y="{{ug.tt1}}" style="fill: var(--on-inverse); font-size: 10px; font-weight: 600; opacity: .75;">Oct 2026</text>
<text x="{{ug.ttx}}" y="{{ug.tt2}}" style="fill: var(--on-inverse); font-size: 13px; font-weight: 800;">47,612 users</text>
</svg>
</section>

<section class="card" style="grid-column: span 4; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0; font-size: 17px; font-weight: 700;">Subscription distribution</h2><span class="cap">All users by plan</span></div>
<div style="display: flex; justify-content: center; padding: 4px 0;">
<svg viewBox="0 0 180 180" style="width: 180px; height: 180px;" role="img" aria-label="Free 84.4 percent, Trial 1.2 percent, Premium monthly 8.5 percent, Premium yearly 5.9 percent">
<circle cx="90" cy="90" r="70" style="fill: none; stroke: var(--track); stroke-width: 22;"></circle>
<sc-for list="{{donut}}" as="d" hint-placeholder-count="4"><circle cx="90" cy="90" r="70" transform="rotate(-90 90 90)" stroke-dasharray="{{d.dash}}" stroke-dashoffset="{{d.off}}" style="fill: none; stroke-width: 22; stroke: {{d.color}};"></circle></sc-for>
<text x="90" y="88" text-anchor="middle" style="fill: var(--text); font-size: 20px; font-weight: 800;">6,942</text>
<text x="90" y="106" text-anchor="middle" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">Premium · 14.4%</text>
</svg>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{donut}}" as="d" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px;"><span class="dot" style="background: {{d.color}};"></span><span style="font-weight: 600; color: var(--muted);">{{d.label}}</span><span style="margin-left: auto; font-weight: 800;">{{d.count}}</span><span class="cap" style="width: 44px; text-align: right;">{{d.pct}}</span></div>
</sc-for>
</div>
</section>
</div>

<div class="g12">
<section class="card" style="grid-column: span 6; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: flex-start; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0; font-size: 17px; font-weight: 700;">Group growth</h2><span class="cap">New groups per month</span></div>
<div style="margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.4px;">12,684</span><span class="cap">active groups</span></div>
</div>
<svg viewBox="0 0 520 200" style="width: 100%; height: auto; display: block;" role="img" aria-label="New groups per month, rising from 640 to 1,340 in October">
<sc-for list="{{gg.grid}}" as="gl" hint-placeholder-count="4"><line x1="36" x2="514" y1="{{gl.y}}" y2="{{gl.y}}" style="stroke: var(--grid);"></line><text x="28" y="{{gl.ty}}" text-anchor="end" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">{{gl.label}}</text></sc-for>
<sc-for list="{{gg.bars}}" as="b" hint-placeholder-count="12"><rect x="{{b.x}}" y="{{b.y}}" width="24" height="{{b.h}}" rx="6" style="fill: {{b.fill}};"></rect><text x="{{b.cx}}" y="192" text-anchor="middle" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">{{b.label}}</text></sc-for>
<text x="{{gg.lx}}" y="{{gg.ly}}" text-anchor="middle" style="fill: var(--primary-text); font-size: 11px; font-weight: 800;">1,340</text>
</svg>
</section>

<section class="card" style="grid-column: span 6; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0; font-size: 17px; font-weight: 700;">Platform activity</h2><span class="cap">Daily events · last 30 days</span></div>
<div style="margin-left: auto; display: flex; gap: 18px;">
<div style="display: flex; flex-direction: column; gap: 2px;"><span class="cap" style="display: flex; align-items: center; gap: 6px;"><span class="dot" style="background: var(--c1);"></span>Expenses</span><span style="font-size: 16px; font-weight: 800;">{{pa.expTotal}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px;"><span class="cap" style="display: flex; align-items: center; gap: 6px;"><span class="dot" style="background: var(--c3);"></span>Settlements</span><span style="font-size: 16px; font-weight: 800;">{{pa.setTotal}}</span></div>
</div>
</div>
<svg viewBox="0 0 520 200" style="width: 100%; height: auto; display: block;" role="img" aria-label="Expenses created and settlements recorded per day over the last 30 days">
<sc-for list="{{pa.grid}}" as="gl" hint-placeholder-count="4"><line x1="36" x2="514" y1="{{gl.y}}" y2="{{gl.y}}" style="stroke: var(--grid);"></line><text x="28" y="{{gl.ty}}" text-anchor="end" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">{{gl.label}}</text></sc-for>
<path d="{{pa.area}}" style="fill: var(--c1); opacity: 0.10;"></path>
<path d="{{pa.l1}}" style="fill: none; stroke: var(--c1); stroke-width: 2.5; stroke-linecap: round;"></path>
<path d="{{pa.l2}}" style="fill: none; stroke: var(--c3); stroke-width: 2.5; stroke-linecap: round;"></path>
<sc-for list="{{pa.xl}}" as="xl" hint-placeholder-count="5"><text x="{{xl.x}}" y="192" text-anchor="middle" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">{{xl.label}}</text></sc-for>
</svg>
</section>
</div>

<div class="g12">
<section class="card" style="grid-column: span 8; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0; font-size: 17px; font-weight: 700;">Synchronization usage</h2><span class="cap">Sync requests per hour by client · today · 1.19M total</span></div>
<div style="margin-left: auto; display: flex; gap: 16px; align-items: center;">
<span class="cap" style="display: flex; align-items: center; gap: 6px;"><span class="dot" style="background: var(--c1);"></span>iOS 46%</span>
<span class="cap" style="display: flex; align-items: center; gap: 6px;"><span class="dot" style="background: var(--c2);"></span>Android 41%</span>
<span class="cap" style="display: flex; align-items: center; gap: 6px;"><span class="dot" style="background: var(--c3);"></span>Web 13%</span>
</div>
</div>
<svg viewBox="0 0 720 210" style="width: 100%; height: auto; display: block;" role="img" aria-label="Hourly sync requests peak at 82 thousand at 19:00">
<sc-for list="{{su.grid}}" as="gl" hint-placeholder-count="4"><line x1="40" x2="714" y1="{{gl.y}}" y2="{{gl.y}}" style="stroke: var(--grid);"></line><text x="32" y="{{gl.ty}}" text-anchor="end" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">{{gl.label}}</text></sc-for>
<sc-for list="{{su.bars}}" as="b" hint-placeholder-count="24">
<rect x="{{b.x}}" y="{{b.y1}}" width="18" height="{{b.h1}}" rx="3" style="fill: var(--c1);"></rect>
<rect x="{{b.x}}" y="{{b.y2}}" width="18" height="{{b.h2}}" rx="3" style="fill: var(--c2);"></rect>
<rect x="{{b.x}}" y="{{b.y3}}" width="18" height="{{b.h3}}" rx="3" style="fill: var(--c3);"></rect>
<text x="{{b.cx}}" y="204" text-anchor="middle" style="fill: var(--subtle); font-size: 10px; font-weight: 600;">{{b.label}}</text>
</sc-for>
</svg>
</section>

<section class="card" style="grid-column: span 4; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: flex-start; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0; font-size: 17px; font-weight: 700;">Failed sync batches</h2><span class="cap">Per day · last 14 days</span></div>
<a href="{{syncHref}}" style="margin-left: auto; font-size: 13px; font-weight: 700; text-decoration: none;">View all</a>
</div>
<div style="display: flex; align-items: center; gap: 10px;"><span style="font-size: 28px; font-weight: 800; letter-spacing: -0.8px;">61</span><span class="up">▼ 44.5%</span><span class="cap">last 7 days</span></div>
