body{margin:0}

.ow-app.dark{--bg:#0D0C16;--surface:#16142A;--raised:#1F1C36;--sunken:#110F20;--border:#2A2744;--border-strong:#3A365A;--divider:#221F3A;--track:#1B1932;--text:#F2F1FA;--muted:#A9A6C4;--subtle:#8F8CAB;--primary:#6A62E6;--primary-text:#ABA5FA;--primary-soft:#26224A;--owed:#43CF93;--owed-fill:#43CF93;--owed-soft:#12332A;--owe:#F59A5B;--owe-fill:#F59A5B;--owe-soft:#3A2416;--danger:#F27583;--danger-soft:#3C1A22;--info:#6EA8F2;--info-soft:#172A45;--inverse:#F2F1FA;--on-inverse:#15132B;--c1:#8A83F4;--c2:#3FCDB9;--c3:#F5B65E;--c4:#F08AA8;--c5:#74AEF5;--cm:#34304F;--grid:#26233F;--shadow:none}
.ow-app a{color:var(--primary-text)}
.ow-app a:hover{color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ov{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--subtle)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted) !important;text-decoration:none}
.nav-a:hover{background:var(--track);color:var(--text) !important}
.nav-a.on{background:var(--primary-soft);color:var(--primary-text) !important;font-weight:700}
.cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:1px 7px}
.btn{font:inherit;font-size:13px;font-weight:700;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--primary);border-color:var(--primary);color:#FFFFFF !important;box-shadow:0 6px 16px -6px rgba(99,91,219,.6)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.gbtn{width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gbtn:hover{background:var(--track)}
.seg{display:inline-flex;background:var(--track);padding:4px;border-radius:12px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:12px;font-weight:700;height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--raised);color:var(--primary-text);box-shadow:0 1px 3px rgba(21,19,43,.12)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--track);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--sunken);text-align:left;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 16px;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--divider);white-space:nowrap;vertical-align:middle}
.tbl tr:hover td{background:var(--sunken)}
.tbl .num{text-align:right}
.tile{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sav{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#FFFFFF;box-shadow:0 0 0 2px var(--surface);margin-left:-8px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:500}
.pg{min-width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;cursor:pointer}
.pg.on{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width: 900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

<div class="ow-app {{theme}}" style="display: flex; flex-wrap: wrap; align-items: stretch;">
<aside style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 20px;">
<a href="{{homeHref}}" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none;">
<span style="width: 34px; height: 34px; border-radius: 11px; background: var(--primary); display: inline-flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" class="ico" style="color: #FFFFFF; width: 20px; height: 20px;" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM8.5 12.5l2.5 2.5 4.5-5"></path></svg></span>
<span style="font-size: 19px; font-weight: 800; letter-spacing: -0.5px; color: var(--text);">Owezy</span>
<span class="badge brand" style="margin-left: auto;">Admin</span>
</a>
<nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 16px;">
<sc-for list="{{nav}}" as="grp" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span class="ov" style="padding: 0 12px 6px; color: var(--subtle);">{{grp.label}}</span>
<sc-for list="{{grp.items}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" class="{{it.cls}}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{it.icon}}"></path></svg>{{it.label}}<sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}"><span class="cnt">{{it.count}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; background: var(--sunken); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--owed-fill);"></span>All systems normal</span>
<span class="cap">API p95 182 ms · v4.12.0</span>
</div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<header style="height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;">
<label style="flex: 1 1 260px; max-width: 420px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--bg); color: var(--subtle);"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.search}}"></path></svg><span class="sr">Search</span><input type="search" placeholder="Search users, groups, IDs…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text);"><kbd style="font: inherit; font-size: 11px; font-weight: 700; color: var(--subtle); border: 1px solid var(--border-strong); border-radius: 6px; padding: 1px 6px;">⌘K</kbd></label>
<span class="badge ok" style="margin-left: auto;">Production</span>
<button type="button" class="ibtn" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{themeIcon}}"></path></svg></button>
<button type="button" class="ibtn" aria-label="Notifications, 5 unread"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--owe-fill); box-shadow: 0 0 0 2px var(--surface);"></span></button>
<span style="display: flex; align-items: center; gap: 10px; padding-left: 6px;"><span style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">RF</span><span style="display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 700;">Ravi Fernando</span><span class="cap">Super admin</span></span></span>
</header>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1440px; width: 100%; box-sizing: border-box;">

<div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.6px;">Groups</h1>
<span class="cap">14,906 groups · $18.4M tracked all-time</span>
</div>
<div style="margin-left: auto; display: flex; gap: 10px;">
<button type="button" class="btn"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.download}}"></path></svg>Export CSV</button>
</div>
</div>

<div class="g4">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;">
<span class="ov">{{s.label}}</span>
<div style="display: flex; align-items: center; gap: 10px;"><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.6px;">{{s.value}}</span><span class="{{s.cls}}">{{s.note}}</span></div>
</div>
</sc-for>
</div>

<section class="card" style="display: flex; flex-direction: column;">
<div style="padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border);">
<div class="seg" role="group" aria-label="Status filter"><sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button type="button" class="{{f.cls}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
<label style="flex: 1 1 220px; max-width: 300px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 12px; color: var(--subtle); margin-left: auto;"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{ic.search}}"></path></svg><span class="sr">Search groups</span><input type="search" placeholder="Group name or ID" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text);"></label>
<button type="button" class="btn">Category: All<svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" class="btn">Currency: All<svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<div style="overflow-x: auto;">
<table class="tbl">
<thead><tr><th>Group</th><th>Owner</th><th>Members</th><th class="num">Expenses</th><th class="num">Total volume</th><th>Currency</th><th>Last activity</th><th>Status</th><th><span class="sr">Actions</span></th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="g" hint-placeholder-count="10">
<tr>
<td><a href="{{detailHref}}" style="display: flex; align-items: center; gap: 12px; text-decoration: none;"><span class="tile" style="background: {{g.bg}}; color: {{g.fg}};"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span><span style="display: flex; flex-direction: column;"><span style="font-weight: 700; color: var(--text);">{{g.name}}</span><span class="cap"><span class="mono">{{g.id}}</span> · {{g.cat}}</span></span></a></td>
<td style="font-weight: 600;">{{g.owner}}</td>
<td><span style="display: inline-flex; align-items: center; padding-left: 8px;"><sc-for list="{{g.avs}}" as="a" hint-placeholder-count="3"><span class="sav" style="background: {{a.c}};">{{a.i}}</span></sc-for><span class="cap" style="margin-left: 8px; font-weight: 700;">{{g.members}}</span></span></td>
<td class="num" style="font-weight: 600;">{{g.exp}}</td>
<td class="num" style="font-weight: 800;">{{g.vol}}</td>
<td><span class="mono" style="color: var(--muted);">{{g.cur}}</span></td>
<td style="color: var(--muted); font-size: 13px;">{{g.last}}</td>
<td><span class="{{g.statusCls}}">{{g.status}}</span></td>
<td style="text-align: right;"><button type="button" class="gbtn" aria-label="More actions for {{g.name}}"><svg viewBox="0 0 24 24" class="ico" style="stroke-width: 3;" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--border); flex-wrap: wrap;">
<span class="cap" style="font-size: 13px;">{{footer}}</span>
<span style="margin-left: auto; display: flex; gap: 6px; align-items: center;">
<button type="button" class="pg" aria-label="Previous page"><svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" class="pg on">1</button><button type="button" class="pg">2</button><button type="button" class="pg">3</button><span class="cap">…</span><button type="button" class="pg">1,491</button>
<button type="button" class="pg" aria-label="Next page"><svg viewBox="0 0 24 24" class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</span>
</div>
</section>

</div>
</main>
</div>

</script>

  renderVals() {
    const dark = this.state.dark != null ? this.state.dark : !!this.props.dark;
    const sfx = dark ? 'Dark' : '';
    const nav = NAV.map(([g, items]) => ({ label: g, items: items.map(([label, icon, file, count]) => ({ label: label, icon: IC[icon], href: file + sfx + '.html', cls: file === ACTIVE ? 'nav-a on' : 'nav-a', count: count || '', hasCount: !!count })) }));
    const f = this.state.filter;
    const counts = { All: '14,906', Active: '12,684', Archived: '2,213', Flagged: '9' };
    const filters = ['All', 'Active', 'Archived', 'Flagged'].map((x) => ({ label: x + ' · ' + counts[x], cls: f === x ? 'on' : '', pick: () => this.setState({ filter: x }) }));
    const rows = GROUPS.filter((g) => f === 'All' || g[12] === f).map((g) => ({
      name: g[0], id: g[1], cat: g[2], icon: IC[g[3]], bg: TONES[g[4]][0], fg: TONES[g[4]][1], owner: g[5],
      avs: g[6].map((i, k) => ({ i: i, c: AV[(i.charCodeAt(0) + k) % AV.length] })), members: g[7] > 3 ? '+' + (g[7] - 3) : g[7] + ' total',
      exp: g[8], vol: g[9], cur: g[10], last: g[11], status: g[12], statusCls: ST[g[12]]
    }));
    return {
      theme: dark ? 'dark' : '', themeIcon: dark ? IC.sun : IC.moon, themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.setState({ dark: !dark }), ic: IC, nav: nav, homeHref: 'Main' + sfx + '.html', detailHref: 'GroupDetails' + sfx + '.html',
      stats: [
        { label: 'Total groups', value: '14,906', note: '▲ 6.2%', cls: 'badge ok' },
        { label: 'Active · 30 days', value: '12,684', note: '85%', cls: 'badge brand' },
        { label: 'Created this month', value: '412', note: 'Nov 1–7', cls: 'badge info' },
        { label: 'Flagged', value: '9', note: 'Review', cls: 'badge bad' }
      ],
      filters: filters, rows: rows, footer: 'Showing ' + rows.length + ' of ' + counts[f]
    };
  }
}
</script>
<script>DC.mount({});</script>
</body>
</html>
