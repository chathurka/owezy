name: owezy_mobile
description: Owezy mobile app — offline-first shared expense and budgeting.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management, DI, and routing
  get: ^4.6.6

  # Networking
  dio: ^5.8.0+1
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.1

  # Storage / security
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^9.2.4

  # UI utilities
  flutter_svg: ^2.1.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  retrofit_generator: ^10.2.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - env/.env.dev
    - env/.env.qa
    - env/.env.prod
    - assets/icons/
    - assets/images/
    - assets/images/welcome/
    - assets/logos/

  # Inter from resources/owezy-mobile/fonts — matches Design system · v1.1
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
